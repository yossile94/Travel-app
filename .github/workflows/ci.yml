name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci

      # Highs are reviewed and tracked in docs/security/dependency-audit.md.
      - name: Dependency audit
        run: npm audit --audit-level=critical

  database:
    name: Database (migrations and RLS tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Read by supabase/config.toml; Google sign-in isn't exercised here.
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Sprint 7 (Raz 2): the connection cases in SQL match the table the app tests.
      - name: Connection cases are current
        run: node scripts/gen-connection-cases.mjs --check

      # Sprint 10 D15: the admin panel's rules and the CHECKs run one table of cases.
      - name: Admin cases are current
        run: node scripts/gen-admin-cases.mjs --check

      # Applies every migration in supabase/migrations to a fresh database.
      - name: Start the database
        run: npx supabase db start

      # pgTAP: RLS and the consent log rules (sprint 1 AC-17).
      - name: RLS and schema tests
        run: npx supabase test db

      - name: Database lint
        run: npx supabase db lint --local --fail-on warning

  functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      # The lock file pins every npm: and jsr: import by hash (ADR-006).
      - name: Lint
        run: deno lint --config supabase/functions/deno.json supabase/functions

      - name: Type check
        run: deno check --frozen --config supabase/functions/deno.json supabase/functions/*/index.ts

      # Sprint 2 AC-18: who is deleted, Google re-authentication, no personal data in logs.
      - name: Tests
        run: deno test --frozen --config supabase/functions/deno.json supabase/functions

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
