# Sprint 13 AC-14: gitleaks over the whole history (every branch), weekly, on
# demand, and on a PR that changes this file. The CI job scans each PR's new
# commits; this one rescans everything.
name: Security scan

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/security-scan.yml

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch every branch
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: gitleaks (all commits on all branches)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            git --log-opts="--all" --redact --verbose --exit-code 1 .
