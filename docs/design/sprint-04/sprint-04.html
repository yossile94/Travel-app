  .name { font-size: calc(28px * min(var(--s), 1.6)); line-height: 1.2; font-weight: 700; margin-top: 4px; padding-inline-end: 48px; }

  .group + .res { border-top: 0; }

  @keyframes spin { to { transform: rotate(360deg); } }
  .fadein { animation: fade .15s cubic-bezier(.2,0,0,1); } @keyframes fade { from { opacity: 0 } }

  /* rate checker */
  table.check { border-collapse: collapse; background: #fff; color: #121C36; font-size: 14px; }

  table.check td.mono { font-variant-numeric: tabular-nums; }

<body>
<header class="top">
  <h1>ספרינט 4: היעד בכף היד</h1>
  <p>הדמיה למסמך <code>docs/design/sprint-04/README.md</code>. מסכים סטטיים ב-411dp (A73). <strong>כל השערים, הרמות וסטטוסי הכניסה הם נתוני הדגמה בלבד</strong>, לא נתונים אמיתיים ולא קביעה לגבי מדינה כלשהי.</p>
</header>
<div class="panel">
  <label>מצב <select id="theme"><option value="light">בהיר</option><option value="dark">כהה</option></select></label>
  <label>גופן <select id="scale"><option value="1">100%</option><option value="1.3">130%</option></select></label>
  <label>שעון המכשיר <select id="clock"><option value="0">26.10.2026 (טרי)</option><option value="4">30.10.2026 (+4 ימים)</option><option value="31">26.11.2026 (+31 יום)</option></select></label>
  <span id="modeNote"></span>
</div>
<div class="grid" id="grid"></div>
<div style="padding:0 24px 48px">
  <h2 style="font-size:18px">בודק השער (README 3.4, ‏usdIls = 3.2)</h2>
  <table class="check" id="checker"></table>
</div>

<script>
'use strict';
const LRI = '⁦', PDI = '⁩';
const iso = (s) => LRI + s + PDI;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

/* ---------- README 3: rate line ---------- */
const UNITS = [1, 10, 100, 1000, 10000];
function sig2(x) {
  if (x >= 100) { const d = Math.floor(Math.log10(x)) + 1; const p = Math.pow(10, d - 2); return String(Math.round(x / p) * p); }
  return x.toPrecision(2);
}
function group(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function rateUnits(rateToIls) { for (const u of UNITS) if (rateToIls * u >= 0.1) return u; return 10000; }
/* README 3: rateParts is the unit-tested part; the line is assembled in the component. */
function rateParts(rateToIls, usdIls, code) {
  if (code === 'ILS') return null;
  if (code === 'USD') return { amount: '1 USD', ils: sig2(usdIls), usd: '' };
  const u = rateUnits(rateToIls);
  const ils = rateToIls * u;
  return { amount: group(u) + ' ' + code, ils: sig2(ils), usd: sig2(ils / usdIls) };
}
/* One Text, one LTR isolate, NBSP inside each part, a normal space only before the middle dot (README 3.3). */
const NB = ' ';
function formatRateLine(rateToIls, usdIls, code) {
  const p = rateParts(rateToIls, usdIls, code);
  if (!p) return null;
  const first = (p.amount + ' = ' + p.ils + ' ₪').replace(/ /g, NB);
  if (!p.usd) return iso(first);
  return iso(first + ' ' + ('· ' + p.usd + ' $').replace(/ /g, NB));
}
const USD_ILS = 3.2;

/* ---------- demo data ---------- */
const FETCHED = new Date(2026, 9, 26);
const fmtDate = (d) => iso(d.getDate() + '.' + (d.getMonth() + 1) + '.' + d.getFullYear());
const state = { theme: 'light', scale: 1, clock: 0 };
const daysOld = () => state.clock;

const WORD = { 1: 'אין אזהרת מסע', 2: 'איום מזדמן', 3: 'איום בינוני', 4: 'איום גבוה' };
const REC = { 1: 'זהירות רגילה', 2: 'זהירות מוגברת', 3: 'להימנע מנסיעות שאינן חיוניות', 4: 'להימנע מהגעה' };

/* ---------- pieces ---------- */
function bar(level, size) {
  let s = '<span class="bar ' + (size || '') + '" aria-hidden="true">';
  for (let i = 1; i <= 4; i++) s += i <= level ? '<i style="background:var(--l' + level + ');border-color:var(--l' + level + ')"></i>' : '<i></i>';
  return s + '</span>';
}
function stalePill() { return '<span class="pill stale">⏲ ייתכן שלא מעודכן</span>'; }
function entryPill(status) {
  if (status === 'banned') return '<span class="pill banned">⊘ אין כניסה</span>';
  if (status === 'restricted') return '<span class="pill restricted">⚠ כניסה מוגבלת</span>';
  return '';
}
function advisoryRow(a) {
  const label = '<div class="caption">אזהרת מסע של המל"ל</div>';
  if (a.kind === 'pending') return '<div class="block">' + label + '<div class="callout t2" style="min-height:24px">בהשלמה</div><div class="footnote t3">עוד לא בדקנו את האזור הזה.</div></div>';
  if (a.kind === 'firstOffline') return '<div class="block">' + label + '<div class="body t2">☁︎ אזהרות המסע יוצגו כשיהיה חיבור</div></div>';
  // ADR-008: (a) nsc_levels non-empty -> level = last value; (b) NSC text, nsc_levels empty; (c) pending (above).
  let line, mixedLine = '';
  if (a.kind === 'noLevel') line = '<span class="t2" aria-hidden="true">ⓘ</span><span class="callout t1">יש פרסום של המל"ל. הרמה לא זוהתה, לפרטים</span>';
  else {
    const levels = a.levels, level = levels[levels.length - 1], mixed = levels.length > 1;
    const txt = (mixed ? 'עד רמה ' : 'רמה ') + level + ' · ' + WORD[level];
    line = bar(level) + '<span class="callout ' + (level === 4 ? 'alertT' : 't1') + '" style="font-weight:' + (level === 4 ? 500 : 400) + '">' + txt + '</span>';
    if (mixed) mixedLine = '<div class="footnote">הרמה משתנה לפי אזור</div>';
  }
  const checked = '<div class="meta"><span class="footnote">נבדק ב-' + fmtDate(FETCHED) + '</span>' + (daysOld() > 30 ? stalePill() : '') + '</div>';
  return '<div class="block">' + label + '<div class="press" data-open="advisory"><div class="grow" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' + line + '</div><span class="chev">‹</span></div>' + mixedLine + checked + '</div>';
}
function rateBlock(r) {
  const label = '<div class="caption">שער חליפין</div>';
  if (!r || r.code === 'ILS') return '';
  if (r.kind === 'none') return '<div class="block">' + label + '<div class="body t2">אין שער זמין</div></div>';
  if (r.kind === 'firstOffline') return '<div class="block">' + label + '<div class="body t2">☁︎ השער יוצג כשיהיה חיבור</div></div>';
  if (r.kind === 'loading') return '<div class="block">' + label + '<div class="skel" style="width:180px;height:16px;margin:8px 0"></div><div class="skel" style="width:96px;height:12px"></div></div>';
  const line = formatRateLine(r.rate, USD_ILS, r.code);
  const old = daysOld() > 3;
  const updated = '<span class="footnote">עודכן ב-' + fmtDate(FETCHED) + '</span>' + (old ? stalePill() : '');
  const attr = r.source === 'boi'
    ? '<div class="meta">' + updated + '<span class="footnote">· מקור: בנק ישראל</span></div>'
    : '<div class="meta">' + updated + '</div><div class="footnote"><span class="link ltr">Rates By Exchange Rate API</span></div>';
  return '<div class="block">' + label + '<div class="press" data-open="calc" data-code="' + r.code + '"><span class="numeric grow t1" style="text-align:right">' + esc(line) + '</span><span class="t2" aria-hidden="true">▦</span></div>' + attr + '</div>';
}
function card(c) {
  const fields =

    (c.currency ? '<div><div class="caption">מטבע</div><div class="value">' + c.currency + '</div><div class="sub">' + iso(c.symbol) + '</div></div>' : '') + '</div>';

function calcSheet() {

    f('cLocal', CALC.name + ' · ' + CALC.code, CALC.code) + f('cIls', 'שקל חדש · ILS', '₪') + f('cUsd', 'דולר אמריקאי · USD', '$') +
    '<div class="footnote" style="margin-top:16px">שער להמחשה בלבד; השער בבנק או בצ\'יינג\' יהיה שונה</div>' +

    '<div class="footnote"><span class="link ltr">Rates By Exchange Rate API</span></div></div>';
  return phone(inner, 'אפשר להקליד ולהדביק');

const VALID = /^\d{0,12}([.,]\d{0,2})?$/;
function wireCalc() {
  const ids = { cLocal: 'local', cIls: 'ils', cUsd: 'usd' };
  const els = {}; for (const id in ids) els[ids[id]] = document.getElementById(id);
  if (!els.local) return;
  const prev = { local: '1000', ils: '', usd: '' };
  const fmt = (x) => { if (!isFinite(x)) return ''; if (Math.abs(x) >= 1e12) return '—'; return x.toFixed(2); };
  function recompute(src) {
    const raw = els[src].value; const x = raw === '' ? NaN : parseFloat(raw);
    let ils, local, usd;
    if (src === 'local') { ils = x * CALC.rate; usd = ils / USD_ILS; local = x; }
    if (src === 'ils') { ils = x; local = x / CALC.rate; usd = x / USD_ILS; }
    if (src === 'usd') { usd = x; ils = x * USD_ILS; local = ils / CALC.rate; }
    for (const k of ['local', 'ils', 'usd']) if (k !== src) { els[k].value = raw === '' ? '' : fmt({ local, ils, usd }[k]); prev[k] = els[k].value; }
  }
  for (const k of ['local', 'ils', 'usd']) {
    els[k].addEventListener('input', () => {
      const msg = document.querySelector('.calcMsg[data-for="' + els[k].id + '"]');
      let v = els[k].value.trim();
      if (v.startsWith('.') || v.startsWith(',')) v = '0' + v;
      if (!VALID.test(v)) {
        const multi = Math.abs(v.length - prev[k].length) > 1;
        els[k].value = prev[k];
        msg.textContent = multi ? 'אפשר להזין רק מספר, עם עד 2 ספרות אחרי הנקודה.' : '';
        return;
      }
      msg.textContent = '';
      v = v.replace(',', '.');
      els[k].value = v; prev[k] = v; recompute(k);
    });
  }
  els.local.value = '1000'; recompute('local');
}

    ['IDR', 0.000198, '1,000 IDR = 0.20 ₪ · 0.062 $'],
    ['USD', 3.2, '1 USD = 3.2 ₪'],
    ['ILS', 1, null],
    ['X', 0.00999, '100 X = 1.0 ₪ · 0.31 $'],
    ['KWD', 12.3, '1 KWD = 12 ₪ · 3.8 $'],
  ];
  const strip = (s) => s == null ? null : s.replace(/[⁦⁩]/g, '').replace(/ /g, ' ');
  // Component check (README 3.4): isolate at both ends, and the only normal space is right before the middle dot.
  const breaksOk = (s) => s == null || (s[0] === '⁦' && s[s.length - 1] === '⁩' && (s.match(/ /g) || []).length === (s.includes('·') ? 1 : 0) && (!s.includes('·') || s.includes(' ·')));
  document.getElementById('checker').innerHTML = '<tr><th>מטבע</th><th>rateToIls</th><th>צפוי</th><th>מחושב</th><th></th></tr>' +
    rows.map(([c, r, want]) => { const raw = formatRateLine(r, USD_ILS, c); const got = strip(raw); const ok = got === want && breaksOk(raw);
      return '<tr><td>' + c + '</td><td class="mono">' + r + '</td><td class="mono ltr">' + esc(want == null ? '(אין שורה)' : want) + '</td><td class="mono ltr">' + esc(got == null ? '(אין שורה)' : got) + '</td><td class="' + (ok ? 'ok">✓' : 'bad">✗') + '</td></tr>'; }).join('') +
    '<tr><td colspan="5">אין שער: "אין שער זמין" · התקנה ראשונה בלי רשת: "השער יוצג כשיהיה חיבור" (סעיף 2.2)</td></tr>';
}

document.getElementById('theme').addEventListener('change', (e) => { state.theme = e.target.value; render(); });
document.getElementById('scale').addEventListener('change', (e) => { state.scale = parseFloat(e.target.value); render(); });
document.getElementById('clock').addEventListener('change', (e) => { state.clock = parseInt(e.target.value, 10); render(); });
render(); renderChecker();
</script>
</body>
