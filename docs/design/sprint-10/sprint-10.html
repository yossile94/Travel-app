<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ספרינט 10: דרכון ואדמין (הדמיה)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Tokens from apps/mobile/src/theme/tokens.ts + tokens-0.11.0.proposed.json. No new hex values. */
  :root { --fs: 1; }
  :root {
    --canvas:#FFFBF5; --surface:#FFFFFF; --raised:#FFFFFF; --tag:#FBF4E8; --pressed:#FBF4E8;
    --t1:#121C36; --t2:#4A5573; --t3:#646E8A; --link:#1561BC; --alert:#C81E16;
    --pBg:#1561BC; --pFg:#FFFFFF; --secBg:#EEF6FF; --secFg:#104C94;
    --infoBg:#EEF6FF; --infoFg:#104C94; --bSub:#F4E7D0; --bCtl:#7D869E;
    --okBg:#E8FAF7; --okFg:#0A665D;
    --redBg:#FFF0EF; --redFg:#A0170F; --redBar:#C81E16;
    --orBg:#FFF2EE; --orFg:#A8381A; --orBar:#C8441F; --orBorder:transparent;
    --toastBg:#121C36; --toastFg:#F3F6FC; --skel:#F4E7D0; --scrim:rgba(6,11,24,0.48);
  }
  body.dark {
    --canvas:#060B18; --surface:#0B1326; --raised:#121C36; --tag:#1A2749; --pressed:#1A2749;
    --t1:#F3F6FC; --t2:#A3B3DB; --t3:#7487BD; --link:#6FB3FA; --alert:#FF5D52;
    --pBg:#6FB3FA; --pFg:#060B18; --secBg:#1A2749; --secFg:#A9D2FF;
    --infoBg:#1A2749; --infoFg:#A9D2FF; --bSub:#1A2749; --bCtl:#7487BD;
    --okBg:#0D2B2E; --okFg:#8FE3D6;
    --redBg:#3A1414; --redFg:#FF8A80; --redBar:#FF5D52;
    --orBg:#1A2749; --orFg:#FF9677; --orBar:#FF7A57; --orBorder:#7487BD;
    --skel:#1A2749; --scrim:rgba(0,0,0,0.6);
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Rubik, system-ui, sans-serif; background:#d9dde6; color:#121C36; }
  body.dark { background:#1d2230; }
  .panelBar { position:sticky; top:0; z-index:10; display:flex; flex-wrap:wrap; gap:16px; align-items:center;
    padding:10px 16px; background:#121C36; color:#F3F6FC; font-size:14px; }
  .panelBar label { display:flex; gap:6px; align-items:center; }
  h2.part { margin:24px 24px 0; font-size:20px; color:#121C36; }
  body.dark h2.part { color:#F3F6FC; }
  .row { display:flex; flex-wrap:wrap; gap:28px; padding:24px; align-items:flex-start; }
  .frame { width:411px; }
  .cap { font-size:13px; color:#34477D; margin:0 0 8px; min-height:52px; }
  body.dark .cap { color:#A3B3DB; }
  .phone { position:relative; width:411px; height:860px; border-radius:28px; overflow:hidden;
    background:var(--canvas); color:var(--t1); box-shadow:0 8px 30px rgba(18,28,54,.25); }
  .phone.dark-only { background:#03060F; color:#F3F6FC; }
  .scroll { position:absolute; inset:0; overflow:hidden; }
  /* type */
  .title1 { font-size:calc(28px*var(--fs)); line-height:calc(34px*var(--fs)); font-weight:700; margin:0; }
  .title2 { font-size:calc(22px*var(--fs)); line-height:calc(28px*var(--fs)); font-weight:600; margin:0; }
  .title3 { font-size:calc(18px*var(--fs)); line-height:calc(24px*var(--fs)); font-weight:600; margin:0; }
  .barT { font-size:calc(20px*var(--fs)); line-height:calc(26px*var(--fs)); font-weight:600; margin:0; }
  .body { font-size:calc(16px*var(--fs)); line-height:calc(24px*var(--fs)); margin:0; }
  .bodyS { font-size:calc(16px*var(--fs)); line-height:calc(22px*var(--fs)); font-weight:600; margin:0; }
  .callout { font-size:calc(15px*var(--fs)); line-height:calc(21px*var(--fs)); margin:0; }
  .foot { font-size:calc(13px*var(--fs)); line-height:calc(18px*var(--fs)); margin:0; }
  .capt { font-size:calc(12px*var(--fs)); line-height:calc(16px*var(--fs)); font-weight:600; margin:0; }
  .numLg { font-size:calc(28px*var(--fs)); line-height:calc(32px*var(--fs)); font-weight:500; font-variant-numeric:tabular-nums; margin:0; }
  .num { font-variant-numeric:tabular-nums; }
  .iso { unicode-bidi:isolate; direction:ltr; }
  .t2 { color:var(--t2); } .t3 { color:var(--t3); }
  .ic12 { width:12px; height:12px; flex:none; } .ic16 { width:16px; height:16px; flex:none; } .ic20 { width:20px; height:20px; flex:none; } .ic24 { width:24px; height:24px; flex:none; }
  .hstack { display:flex; align-items:center; gap:8px; }
  .vstack { display:flex; flex-direction:column; gap:8px; }
  .between { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .wrap { display:flex; flex-wrap:wrap; gap:8px; }
  .stateLabel { font-family:monospace; font-size:11px; color:var(--t3); direction:ltr; display:block; margin:8px 0 2px; }
  .dim { position:absolute; font:11px monospace; color:#FFD9D6; direction:ltr; }
  /* app chrome */
  .bar { display:flex; align-items:center; gap:4px; min-height:56px; padding-inline-end:16px; margin-top:28px; }
  .backBtn { width:48px; height:48px; display:grid; place-items:center; flex:none; }
  html[dir=rtl] .flipRtl { transform:scaleX(-1); }
  .content { padding:8px 16px 16px; display:flex; flex-direction:column; gap:calc(16px*min(var(--fs),1.3)); }
  .footer { position:absolute; inset-inline:0; bottom:0; padding:12px 16px 28px; border-top:1px solid var(--bSub); background:var(--canvas); }
  /* controls */
  .btn { min-height:48px; border-radius:999px; border:0; font:inherit; font-size:calc(16px*var(--fs)); font-weight:500;
    display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:0 20px; }
  .b-primary { background:var(--pBg); color:var(--pFg); width:100%; }
  .b-secondary { background:var(--secBg); color:var(--secFg); flex:1 1 160px; }
  body.dark .b-secondary { border:1px solid var(--bCtl); }

  .b-text.ink { color:var(--t1); }
  .notice { display:flex; gap:8px; padding:12px; border-radius:12px; background:var(--infoBg); color:var(--infoFg); align-items:flex-start; }
  .flabel { font-size:calc(13px*var(--fs)); line-height:calc(18px*var(--fs)); font-weight:500; color:var(--t2); margin:0 0 4px; }
  .field { min-height:48px; border:1px solid var(--bCtl); border-radius:8px; padding:0 12px; display:flex; align-items:center; justify-content:space-between; gap:8px; background:var(--surface);
    font-size:calc(16px*var(--fs)); }
  .field.err { border:2px solid var(--alert); }
  .ferr { display:flex; gap:6px; align-items:center; color:var(--alert); }
  .chip { display:inline-flex; align-items:center; gap:4px; border-radius:999px; padding:2px 8px; font-size:calc(12px*var(--fs)); line-height:calc(16px*var(--fs)); font-weight:500; align-self:flex-start; }
  .c-ok { background:var(--okBg); color:var(--okFg); }
  .c-tag { background:var(--tag); color:var(--t2); }
  .c-or { background:var(--orBg); color:var(--orFg); } body.dark .c-or { border:1px solid var(--bCtl); }
  .pchip { min-height:40px; display:inline-flex; align-items:center; gap:6px; padding:0 14px; border-radius:999px; border:1px solid var(--bCtl); font-size:calc(15px*var(--fs)); }
  .list { border-radius:12px; background:var(--surface); overflow:hidden; }
  body.dark .list { border:1px solid var(--bSub); }
  .lrow { display:flex; align-items:center; gap:12px; min-height:64px; padding:10px 16px; border-top:1px solid var(--bSub); }
  .lrow:first-child { border-top:0; }
  .avatar { width:36px; height:36px; border-radius:50%; background:var(--tag); color:var(--t1); display:grid; place-items:center; font-weight:600; flex:none; }
  .grow { flex:1; min-width:0; }
  /* photo tile */
  .tile { display:flex; gap:12px; padding:12px; border-radius:12px; background:var(--surface); border:1px solid var(--bSub); }
  .thumb { width:72px; height:96px; border-radius:8px; background:var(--tag); display:grid; place-items:center; color:var(--t2); flex:none; }
  /* banners */
  .banner { position:relative; border-radius:12px; padding:12px; padding-inline-start:16px; display:flex; flex-direction:column; gap:8px; overflow:hidden; }
  .banner::before { content:''; position:absolute; inset-block:0; inset-inline-start:0; width:4px; }
  .banner.red { background:var(--redBg); } .banner.red::before { background:var(--redBar); }
  .banner.red .bt { color:var(--redFg); }
  .banner.or { background:var(--orBg); border:1px solid var(--orBorder); } .banner.or::before { background:var(--orBar); }
  .banner.or .bt { color:var(--orFg); }
  .brow { display:flex; align-items:center; justify-content:space-between; min-height:48px; padding:0 12px; border-radius:8px; background:var(--surface); }
  .reminder { border-radius:12px; padding:12px; background:var(--infoBg); color:var(--infoFg); display:flex; flex-direction:column; gap:8px; }
  .reminder .btn.b-secondary { background:var(--surface); flex:0 0 auto; }
  /* country card context */
  .card { position:absolute; inset-inline:12px; top:60px; bottom:24px; background:var(--raised); border-radius:24px; padding:16px; display:flex; flex-direction:column; gap:10px; overflow:hidden; }
  body.dark .card { border:1px solid rgba(163,179,219,0.16); }
  .strip { width:40px; height:4px; border-radius:2px; background:#FF7A57; }
  .openRow { background:var(--tag); border-radius:16px; padding:12px; display:flex; flex-direction:column; gap:10px; }
  body.dark .openRow { background:#1A2749; }
  body.dark .openRow .brow { background:#121C36; }
  .entryTag { display:inline-flex; gap:4px; align-items:center; border-radius:999px; padding:2px 8px; background:var(--okBg); color:var(--okFg); font-size:calc(12px*var(--fs)); font-weight:500; }
  /* sheet + toast + alert dialog */
  .scrimL { position:absolute; inset:0; background:var(--scrim); }
  .sheet { position:absolute; inset-inline:0; bottom:0; background:var(--raised); border-radius:28px 28px 0 0; padding:8px 16px 28px; display:flex; flex-direction:column; gap:12px; }
  body.dark .sheet { border-top:1px solid var(--bSub); }
  .handle { width:32px; height:4px; border-radius:2px; background:var(--bCtl); opacity:.6; margin:4px auto; }
  .x { position:absolute; inset-inline-end:8px; top:8px; width:48px; height:48px; display:grid; place-items:center; color:var(--t1); }
  .toast { position:absolute; inset-inline:16px; padding:12px 16px; border-radius:12px; background:var(--toastBg); color:var(--toastFg); font-size:calc(14px*var(--fs)); line-height:calc(20px*var(--fs)); }
  .alertDlg { position:absolute; inset-inline:28px; background:var(--raised); border-radius:24px; padding:24px; display:flex; flex-direction:column; gap:12px; }
  .alertDlg .acts { display:flex; justify-content:flex-end; gap:8px; }
  /* camera */
  .camTop { position:absolute; top:28px; inset-inline:0; display:flex; align-items:center; justify-content:space-between; padding:0 8px; color:#F3F6FC; }
  .camBtn { width:48px; height:48px; border-radius:50%; display:grid; place-items:center; background:rgba(18,28,54,0.88); border:1px solid rgba(163,179,219,0.32); color:#F3F6FC; }
  .pill { position:absolute; inset-inline:24px; padding:10px 14px; border-radius:12px; background:#121C36; color:#F3F6FC; text-align:center; font-size:calc(14px*var(--fs)); line-height:calc(20px*var(--fs)); }
  .shutter { position:absolute; bottom:60px; left:50%; margin-left:-36px; width:72px; height:72px; border-radius:50%; border:4px solid #F3F6FC; display:grid; place-items:center; }
  .shutter::after { content:''; width:52px; height:52px; border-radius:50%; background:#F3F6FC; }
  .darkPanel { position:absolute; inset-inline:0; bottom:0; padding:16px 16px 28px; background:#060B18; display:flex; flex-direction:column; gap:12px; color:#F3F6FC; }
  .darkPanel .notice { background:#1A2749; color:#A9D2FF; }
  .darkPanel .field { background:#0B1326; border-color:#7487BD; color:#F3F6FC; }
  .darkPanel .b-primary { background:#6FB3FA; color:#060B18; }
  .darkPanel .b-text { color:#6FB3FA; }
  .darkPanel .c-ok { background:#0D2B2E; color:#8FE3D6; }
  .darkPanel .t2 { color:#A3B3DB; }
  .sysPrompt { position:absolute; inset-inline:24px; bottom:40px; background:#E9EEFA; color:#121C36; border-radius:24px; padding:24px; display:flex; flex-direction:column; gap:12px; align-items:center; text-align:center; }
  .shade { position:absolute; inset:0; background:#0B1326; color:#F3F6FC; padding:40px 12px; display:flex; flex-direction:column; gap:10px; }
  .notif { background:#1A2749; border-radius:20px; padding:12px 14px; display:flex; flex-direction:column; gap:2px; }
  .notif .app { font-size:12px; color:#A3B3DB; display:flex; gap:6px; align-items:center; }

  /* ===================== admin (desktop, light only, CSS variables named from tokens) ===================== */
  .desk {
    --color-bg-canvas:#FFFBF5; --color-bg-surface:#FFFFFF; --color-bg-surface-alt:#FBF4E8; --color-bg-pressed:#FBF4E8; --color-bg-tag:#FBF4E8;
    --color-text-primary:#121C36; --color-text-secondary:#4A5573; --color-text-tertiary:#646E8A; --color-text-link:#1561BC; --color-text-alert:#C81E16;
    --color-action-primary-bg:#1561BC; --color-action-primary-fg:#FFFFFF; --color-action-secondary-bg:#EEF6FF; --color-action-secondary-fg:#104C94;
    --color-action-cta-bg:#C8441F; --color-action-cta-fg:#FFFFFF; --color-action-disabled-bg:#E9EEFA; --color-action-disabled-fg:#646E8A;
    --color-status-success-subtle-bg:#E8FAF7; --color-status-success-subtle-fg:#0A665D;
    --color-entry-restricted-bg:#FFF2EE; --color-entry-restricted-fg:#A8381A; --color-entry-banned-bg:#C81E16; --color-entry-banned-fg:#FFFFFF;
    --color-status-info-subtle-bg:#EEF6FF; --color-status-info-subtle-fg:#104C94;
    --color-border-subtle:#F4E7D0; --color-border-control:#7D869E; --color-focus-ring:#1F78DB; --color-skeleton:#F4E7D0;
    --color-toast-bg:#121C36; --color-toast-fg:#F3F6FC; --color-scrim:rgba(6,11,24,0.48);
    --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-pill:999px;
    position:relative; width:1200px; height:760px; border-radius:12px; overflow:hidden; background:var(--color-bg-canvas); color:var(--color-text-primary);
    box-shadow:0 8px 30px rgba(18,28,54,.25); font-size:16px; line-height:24px;
  }
  .dframe { width:1200px; }
  .desk * { font-size:inherit; }
  .desk h1 { font-size:28px; line-height:34px; font-weight:700; margin:0; }
  .desk h2 { font-size:22px; line-height:28px; font-weight:600; margin:0; }
  .desk .sub { color:var(--color-text-secondary); font-size:13px; line-height:18px; margin:4px 0 0; }
  .desk p { margin:0; }
  .dtop { height:56px; display:flex; align-items:center; gap:16px; padding:0 24px; background:var(--color-bg-surface); border-bottom:1px solid var(--color-border-subtle); }
  .dtop .brand { font-weight:600; font-size:18px; }
  .env { background:var(--color-status-info-subtle-bg); color:var(--color-status-info-subtle-fg); border-radius:999px; padding:2px 10px; font-size:12px; font-weight:600; }
  .dtop .spacer { flex:1; }
  .rtag { background:var(--color-bg-tag); color:var(--color-text-secondary); border-radius:999px; padding:2px 10px; font-size:12px; font-weight:600; }
  .dlink { color:var(--color-text-link); text-decoration:underline; min-height:44px; display:inline-flex; align-items:center; padding:0 4px; }
  .dbody { display:flex; height:704px; }
  .dnav { width:232px; flex:none; padding:16px 12px; display:flex; flex-direction:column; gap:4px; border-inline-end:1px solid var(--color-border-subtle); }
  .dnav a { min-height:44px; display:flex; align-items:center; padding:0 12px; border-radius:8px; color:var(--color-text-primary); text-decoration:none; }
  .dnav a[aria-current] { background:var(--color-action-secondary-bg); color:var(--color-action-secondary-fg); font-weight:600; }
  .dnav hr { border:0; border-top:1px solid var(--color-border-subtle); margin:8px 0; width:100%; }
  .dmain { flex:1; padding:32px; overflow:hidden; display:flex; flex-direction:column; gap:16px; max-width:1120px; }
  .dbtn { min-height:44px; border-radius:999px; border:0; padding:0 20px; font:inherit; font-weight:500; display:inline-flex; align-items:center; gap:8px; }
  .dbtn.primary { background:var(--color-action-primary-bg); color:var(--color-action-primary-fg); }
  .dbtn.cta { background:var(--color-action-cta-bg); color:var(--color-action-cta-fg); }
  .dbtn.dis { background:var(--color-action-disabled-bg); color:var(--color-action-disabled-fg); }
  .dbtn.ghost { background:var(--color-action-secondary-bg); color:var(--color-action-secondary-fg); }
  .dinput { min-height:44px; border:1px solid var(--color-border-control); border-radius:8px; padding:0 12px; display:flex; align-items:center; background:var(--color-bg-surface); gap:8px; }
  .dinput.err { border:2px solid var(--color-text-alert); }
  .dinput.focus { outline:2px solid var(--color-focus-ring); outline-offset:2px; }
  .dlabel { font-size:14px; font-weight:500; margin-bottom:4px; display:block; }
  .dhelp { font-size:13px; line-height:18px; color:var(--color-text-secondary); margin-top:4px; }
  .derr { font-size:13px; line-height:18px; color:var(--color-text-alert); margin-top:4px; display:flex; gap:4px; align-items:center; }
  table.dt { width:100%; border-collapse:collapse; background:var(--color-bg-surface); border-radius:12px; overflow:hidden; font-size:15px; }
  table.dt th { text-align:start; background:var(--color-bg-surface-alt); color:var(--color-text-secondary); font-weight:600; font-size:13px; height:40px; padding:0 12px; }
  table.dt td { height:48px; padding:0 12px; border-top:1px solid var(--color-border-subtle); }
  table.dt tr.hover td { background:var(--color-bg-pressed); }
  table.dt a { color:var(--color-text-primary); text-decoration:none; font-weight:500; }
  .stag { border-radius:999px; padding:2px 10px; font-size:12px; font-weight:600; white-space:nowrap; }
  .s-allowed { background:var(--color-status-success-subtle-bg); color:var(--color-status-success-subtle-fg); }
  .s-restricted { background:var(--color-entry-restricted-bg); color:var(--color-entry-restricted-fg); }
  .s-banned { background:var(--color-entry-banned-bg); color:var(--color-entry-banned-fg); }
  .s-none { background:var(--color-bg-tag); color:var(--color-text-secondary); }
  .pager { display:flex; align-items:center; justify-content:space-between; color:var(--color-text-secondary); font-size:14px; }
  .dcard { background:var(--color-bg-surface); border-radius:16px; padding:32px; box-shadow:0 4px 12px rgba(18,28,54,.1); display:flex; flex-direction:column; gap:16px; }
  .center { display:flex; align-items:center; justify-content:center; height:100%; flex-direction:column; gap:12px; }
  fieldset.dfs { border:1px solid var(--color-border-subtle); border-radius:12px; padding:12px 16px 16px; margin:0; }
  fieldset.dfs legend { font-weight:600; padding:0 4px; font-size:15px; }
  .radios { display:flex; gap:20px; flex-wrap:wrap; }
  .radio { min-height:44px; display:inline-flex; align-items:center; gap:8px; }
  .rdot { width:20px; height:20px; border-radius:50%; border:2px solid var(--color-border-control); display:grid; place-items:center; }
  .rdot.on { border-color:var(--color-action-primary-bg); }
  .rdot.on::after { content:''; width:10px; height:10px; border-radius:50%; background:var(--color-action-primary-bg); }
  .summary { border-radius:12px; padding:12px 16px; background:var(--color-status-info-subtle-bg); color:var(--color-text-primary); border-inline-start:4px solid var(--color-text-alert); }
  .dscrim { position:absolute; inset:0; background:var(--color-scrim); }
  .ddialog { position:absolute; top:150px; left:50%; margin-left:-260px; width:520px; background:var(--color-bg-surface); border-radius:16px; padding:24px; display:flex; flex-direction:column; gap:12px; box-shadow:0 16px 40px rgba(18,28,54,.2); }
  .ddialog ul { margin:0; padding-inline-start:20px; color:var(--color-text-secondary); }
  .dtoast { position:absolute; bottom:24px; inset-inline-end:24px; background:var(--color-toast-bg); color:var(--color-toast-fg); border-radius:12px; padding:12px 16px; font-size:14px; max-width:420px; }
  .mono { font-family:ui-monospace, monospace; direction:ltr; unicode-bidi:isolate; }
  .diff { background:var(--color-bg-surface-alt); }
  .diff td { font-size:14px; }
  .sketch { border:2px dashed var(--color-border-control); border-radius:12px; padding:16px; color:var(--color-text-secondary); }
  .skipLink { position:absolute; top:8px; inset-inline-start:8px; background:var(--color-bg-surface); outline:2px solid var(--color-focus-ring); padding:4px 10px; border-radius:8px; font-size:13px; z-index:2; }
</style>
</head>
<body>
<div class="panelBar" role="toolbar" aria-label="הגדרות ההדמיה">

let L = S.he, D = A.he, lang = 'he';
const icon = (id, cls='ic16', extra='') => `<svg class="${cls} ${extra}" aria-hidden="true"><use href="#${id}"/></svg>`;
const iso = (s) => `<span class="iso num">${s}</span>`;
const phone = (inner, cap, dark=false) => `<div class="frame"><p class="cap">${cap}</p><div class="phone${dark?' dark-only':''}">${inner}</div></div>`;
const desk = (inner, cap) => `<div class="dframe"><p class="cap">${cap}</p><div class="desk">${inner}</div></div>`;

/* ---------- app parts ---------- */
const bar = (title, sub, closeIcon=false) => `<div class="bar"><span class="backBtn">${closeIcon?icon('close','ic24'):icon('back','ic24','flipRtl')}</span>
  <div class="grow"><p class="barT" role="heading">${title}</p>${sub?`<p class="foot t2">${sub}</p>`:''}</div></div>`;
const notice = (text, ic='info') => `<div class="notice">${icon(ic,'ic20')}<p class="callout">${text}</p></div>`;
const field = (label, value, {err=null, ltr=false, cal=false, ph=false}={}) => `<div><p class="flabel">${label}</p>
  <div class="field${err?' err':''}"><span class="${ltr?'iso num':''} ${ph?'t3':''}">${value}</span>${cal?icon('cal','ic20'):''}</div>
  ${err?`<p class="foot ferr">${icon('alert')}${err}</p>`:''}</div>`;
const holder = (initial, name, line, {photo=false, expired=false}={}) => `<div class="lrow" role="button"><span class="avatar">${initial}</span>
  <div class="grow"><p class="bodyS">${name}</p><div class="hstack"><p class="foot t2">${line}</p>${photo?`<span class="t2">${icon('camera')}</span>`:''}${expired?`<span class="chip c-or">${icon('warn','ic12')}${L.expired}</span>`:''}</div></div>
  <span class="t2">${icon('chev','ic20','flipRtl')}</span></div>`;
const bannerRow = (text) => `<div class="brow" role="button"><p class="callout num">${text}</p><span class="t2">${icon('chev','ic20','flipRtl')}</span></div>`;
const banner = (kind, title, body, rows) => `<div class="banner ${kind}" role="group"><div class="hstack bt">${icon(kind==='red'?'alert':'warn','ic20')}<p class="bodyS">${title}</p></div>
  <p class="callout">${body}</p>${rows.map(bannerRow).join('')}</div>`;
function tripCard(inner){
  return `<div class="card"><div class="strip"></div><p class="capt t2">${L.trips}</p>
    <div class="openRow"><div class="between"><p class="bodyS">${L.tripName}</p><p class="foot t2 num">${iso(L.tripDates)}</p></div>
    ${inner}

/* schematic passport data page (not a real document) */
function passportPage(w=315, h=222, x=48, y=0){
  return `<g transform="translate(${x},${y})"><rect width="${w}" height="${h}" rx="6" fill="#EAD6B3"/>
    <rect x="14" y="20" width="62" height="80" rx="3" fill="#BFA071"/>
    ${[24,40,56,72,88].map(yy=>`<rect x="92" y="${yy}" width="${120+((yy*7)%60)}" height="7" rx="2" fill="#8F7550" opacity=".55"/>`).join('')}
    <text x="12" y="${h-30}" font-family="monospace" font-size="10.4" fill="#4A5573" direction="ltr">P&lt;ISRCOHEN&lt;&lt;NOA&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;</text>
    <text x="12" y="${h-14}" font-family="monospace" font-size="10.4" fill="#4A5573" direction="ltr">12345678&lt;0ISR1501012F2903149&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;0</text></g>`;
}
function cameraSvg({detected=false, photo=false}={}){
  const fx=24, fy=258, fw=363, fh=256, band=Math.round(fh*0.22);
  const c = detected ? '#4FCFBE' : '#F3F6FC';
  const corner = (x,y,dx,dy)=>`<path d="M${x} ${y+dy*28}V${y}H${x+dx*28}" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"/>`;
  return `<svg style="position:absolute;inset:0" viewBox="0 0 411 860" aria-hidden="true">
    <rect width="411" height="860" fill="${photo?'#1A2749':'#2b2b2b'}"/>
    ${passportPage(330, 232, 40, 270)}
    <defs><mask id="hole"><rect width="411" height="860" fill="#fff"/><rect x="${fx}" y="${fy}" width="${fw}" height="${fh}" rx="8" fill="#000"/></mask></defs>
    <rect width="411" height="860" fill="#03060F" fill-opacity="0.55" mask="url(#hole)"/>
    ${corner(fx,fy,1,1)}${corner(fx+fw,fy,-1,1)}${corner(fx,fy+fh,1,-1)}${corner(fx+fw,fy+fh,-1,-1)}
    <rect x="${fx+10}" y="${fy+fh-band}" width="${fw-20}" height="${band-8}" rx="4" fill="none" stroke="#03060F" stroke-opacity=".6" stroke-width="4"/>
    <rect x="${fx+10}" y="${fy+fh-band}" width="${fw-20}" height="${band-8}" rx="4" fill="none" stroke="#6FB3FA" stroke-width="2"/>
  </svg>`;
}

}

function shell(active, inner, {admin=true}={}){
  const it = (k) => `<a href="#" ${k===active?'aria-current="page"':''}>${D.nav[k]}</a>`;
  return `<div class="dtop"><span class="brand">${D.product}</span><span class="env">${D.env}</span><span class="spacer"></span>
      <span class="mono" style="font-size:14px;color:var(--color-text-secondary)">yossi@example.com</span><span class="rtag">${admin?D.role.admin:D.role.editor}</span>
      <a class="dlink">${D.locale}</a><a class="dlink">${D.signOut}</a></div>
    <div class="dbody"><nav class="dnav" aria-label="main">${it('entry')}${it('mct')}${admin?`<hr>${it('audit')}${it('roles')}`:''}</nav>
    <main class="dmain">${inner}</main></div>`;
}
const dfield = (label, value, {err=null, help=null, ltr=false, focus=false, w='100%'}={}) => `<div style="width:${w}"><label class="dlabel">${label}</label>
  <div class="dinput${err?' err':''}${focus?' focus':''}"><span class="${ltr?'mono':''}">${value}</span></div>
  ${err?`<p class="derr">${icon('alert')}${err}</p>`:''}${help?`<p class="dhelp">${help}</p>`:''}</div>`;
const stag = (s) => `<span class="stag s-${s}">${D.st[s]}</span>`;

  out.push(desk(shell('audit', `<div><h1>${D.auditTitle}</h1></div>

        <tr><td class="num">28.10.2026 13:40</td><td class="mono">yossi@example.com</td><td>${D.tRoles} · <span class="mono">dana@example.com</span></td><td>${D.ins}</td><td>▸ ${D.fields(1)}</td></tr></tbody></table>
      <div class="pager"><span></span><div class="hstack"><span class="dbtn dis">‹ ${D.newer}</span><span class="dbtn ghost">${D.older} ›</span></div></div>`),
    'ט · יומן השינויים (Admin בלבד): לקריאה בלבד. החדש ראשון, 50 בעמוד, דפדוף לפי מפתח ("חדשים יותר / ישנים יותר"). השינוי ב-<details>: שם העמודה כמו שהוא, ישן → חדש.'));

  // J. roles
  out.push(desk(shell('roles', `<div><h1>${D.rolesTitle}</h1></div>
      <fieldset class="dfs"><legend>${D.addRole}</legend><div class="hstack" style="align-items:flex-end;gap:16px">
        ${dfield(D.email, 'dana@example.com', {ltr:true, w:'320px'})}
        <div style="width:220px"><label class="dlabel">${D.roleL}</label><div class="dinput"><span>${D.role.editor} ▾</span></div></div>
        <span class="dbtn primary">${D.add}</span></div><p class="dhelp">${D.rolesHelp}</p></fieldset>
      <table class="dt"><thead><tr><th scope="col">${D.rcol.user}</th><th scope="col">${D.rcol.roles}</th><th scope="col">${D.rcol.added}</th></tr></thead>
      <tbody><tr><td><span class="mono">yossi@example.com</span> ${D.you}<p class="dhelp" style="margin:0">${D.self}</p></td><td><span class="stag s-none">${D.role.admin}</span></td><td class="num">28.10.2026</td></tr>
        <tr><td class="mono">dana@example.com</td><td><span class="stag s-none" style="display:inline-flex;gap:6px;align-items:center">${D.role.editor}<span role="button" aria-label="remove" style="display:inline-grid;place-items:center;width:20px;height:20px">${icon('close','ic12')}</span></span></td><td class="num">28.10.2026</td></tr>
        <tr><td class="mono">raz@example.com</td><td><span class="stag s-none" style="opacity:.7">${D.role.admin} ✕</span><p class="dhelp" style="margin:0">${D.lastAdmin}</p></td><td class="num">27.10.2026</td></tr></tbody></table>
      <p class="dhelp">[state shown for illustration: "last Admin" applies when only one Admin row exists]</p>`),
    'י · תפקידים (Admin בלבד): הוספה לפי מייל (משתמש שנכנס פעם אחת). השורה שלך בלי ✕ (D12). ה-Admin האחרון: ✕ מושבת עם הסבר גלוי. ✕ על תג עם אזור לחיצה של 44. השרת אוכף בכל מקרה.'));

  // K. below the line
  out.push(desk(shell('entry', `<h1>${D.sketchTitle}</h1>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px">
        <div class="sketch"><h2>${D.missions}</h2><p>${he?'שגרירות ישראל בבנגקוק · בנגקוק':'Embassy of Israel in Bangkok · Bangkok'} · <span class="mono">THA, LAO, KHM</span> · 1.5.2026 <span class="stag s-restricted">${D.review}</span></p>
          <p class="dhelp">${he?'טופס: כתובת, טלפונים (רשימה, normalizePhone, דחיית קידומת כפולה), שעות, covers (בורר מדינות), מקור https, תאריך. מחיקה: Admin בלבד (D14). "לבדיקה" אחרי 90 יום.':'Form: address, phones (list, normalizePhone, double-prefix rejected), hours, covers (country picker), https source, date. Delete: Admin only (D14). "Review" after 90 days.'}</p></div>
        <div class="sketch"><h2>${D.emergency}</h2><p>${he?'משטרה':'Police'}: (●) <span class="mono">191</span> ( ) ${he?'אין':'none'} ( ) ${he?'בהשלמה':'pending'}</p>
          <p>${he?'אמבולנס':'Ambulance'}: ( ) ${he?'מספר':'number'} ( ) ${he?'אין':'none'} (●) ${he?'בהשלמה':'pending'}</p>
          <p class="dhelp">${he?'2–6 ספרות. verified מחייב מקור ותאריך, none מחייב מקור. "בהשלמה" ערך מפורש (AC-21).':'2–6 digits. verified needs a source and date, none needs a source. "pending" is an explicit value (AC-21).'}</p></div></div>`),
    'יא · מתחת לקו (AC-20, AC-21): סקיצה בלבד, לא לפיתוח בספרינט הזה. המטרה: לוודא שהמעטפת, הטבלה והטופס מחזיקים אותם בלי שינוי.'));

  document.getElementById('desks').innerHTML = out.join('');
}

function apply(){
  lang = document.getElementById('lang').value;
  L = S[lang]; D = A[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';
  document.body.classList.toggle('dark', document.getElementById('dark').checked);
  document.documentElement.style.setProperty('--fs', document.getElementById('fs').value);
  phones(); desks();
}
['dark','fs','lang'].forEach(id => document.getElementById(id).addEventListener('change', apply));
apply();
</script>
