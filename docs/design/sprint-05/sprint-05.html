};

const TAG = {
  onTime: ['p-ok', I.check], delayed: ['p-alsub', I.clock], gateChanged: ['p-alsub', I.swap],
  cancelled: ['p-al', I.noentry], diverted: ['p-al', I.divert], departed: ['p-plan', I.up],
  landed: ['p-end', I.down], paused: ['p-end', I.pause], untracked: ['p-end', ''],
};

const S = { theme: 'light', scale: 1, lang: 'he', state: 'delayed', pnrShown: false };

// LY81 scenarios. Times local; BKK is Israel + 5 in December.
function ly81(state) {
  const base = { dep: '21:40', arr: '13:15', arrIl: '08:15', gate: 'B4', tags: [], track: 'upd', mins: 4, depOld: null, arrOld: null, gateChanged: false, events: [] };
  switch (state) {
    case 'onTime': return { ...base, tags: ['onTime'] };
    case 'delayed': return { ...base, dep: '23:10', depOld: '21:40', arr: '14:45', arrIl: '09:45', arrOld: '13:15', gate: 'B6', gateChanged: true, tags: ['delayed', 'gateChanged'],
      events: [['clock', 'dep'], ['swap', 'gate']] };
    case 'cancelled': return { ...base, tags: ['cancelled'], events: [['noentry', 'cancelled']] };
    case 'diverted': return { ...base, tags: ['diverted'], mins: 9, events: [['divert', 'diverted']] };
    case 'departed': return { ...base, dep: '21:52', tags: ['departed'], mins: 12 };
    case 'landed': return { ...base, dep: '21:52', arr: '13:05', arrIl: '08:05', tags: ['landed'], mins: 31 };
    case 'paused': return { ...base, tags: ['paused'], track: 'paused' };
    case 'notChecked': return { ...base, track: 'notChecked' };
    case 'notFound': return { ...base, gate: null, track: 'notFound' };
    case 'untracked': return { ...base, gate: null, tags: ['untracked'], track: 'untracked' };
    case 'ended': return { ...base, track: 'ended' };
  }
}

function tags(list, t) {
  return list.map((k) => `<span class="pill ${TAG[k][0]}">${TAG[k][1]}${t.tags[k]}</span>`).join('');
}
function trackLine(f, t) {
  if (f.track === 'upd') return t.upd(f.mins);
  if (f.track === 'paused') return `${t.paused} ${t.upd2h}`;
  return t[f.track];
}

function flightRow(t, f, which) {
  const isOut = which === 'out';
  const num = isOut ? 'LY81' : 'LY82';
  const dir = isOut ? t.outbound : t.ret;
  const date = isOut ? '20.12' : '5.1';
  const o = isOut ? 'TLV' : 'BKK', d = isOut ? 'BKK' : 'TLV';
  const depT = f.depOld ? `<span class="numeric alertT">${L(f.dep)}</span> <span class="footnote t2 strike">${L(f.depOld)}</span>` : `<span class="numeric">${L(f.dep)}</span>`;
  const arrT = f.arrOld ? `<span class="footnote t2 strike">${L(f.arrOld)}</span> <span class="numeric alertT">${L(f.arr)}</span>` : `<span class="numeric">${L(f.arr)}</span>`;
  const depIl = isOut ? '' : `<div class="footnote">${t.il(L(f.depIl || '10:05'))}</div>`;
  const arrIl = isOut ? `<div class="footnote">${t.il(L(f.arrIl))}</div>` : '';
  const gate = f.gate ? `${t.term} ${L(isOut ? '3' : '1')} · ${t.gate} <span class="${f.gateChanged ? 'alertT' : ''}">${L(f.gate)}</span> · ${t.seat} ${L('34A')}` : `${t.seat} ${L('34A')}`;
  return `<div class="frow" data-open="sheet" title="testID: card-flight-${num}">
    <div class="fhead"><span class="caption">${dir} · ${L(date)}</span><span class="tags">${tags(f.tags, t)}</span></div>
    <div style="margin-top:2px"><span class="code callout t1">${num}</span> <span class="callout t2">· ${t.elal}</span></div>
    <div class="route"><span class="code title3">${o}</span><span class="line"><span class="plane">${I.plane}</span></span><span class="code title3">${d}</span></div>
    <div class="cols"><div>${depT}${depIl}</div><div>${arrT}${isOut ? '<span class="off">' + L('+1') + '</span>' : ''}${arrIl}</div></div>
    <div class="footnote" style="margin-top:4px">${gate}</div>
    <div class="ftrack"><span class="footnote">${trackLine(f, t)}</span>${I.chev}</div>
  </div>`;
}

}

      <div class="list">${r(`הלוך · <span class="code">LY81</span> · ${L('20.12')}`, `<span class="code">TLV</span> ‹ <span class="code">BKK</span> · ${L('21:40')}`)}${r(`חזור · <span class="code">LY82</span> · ${L('5.1')}`, `<span class="code">BKK</span> ‹ <span class="code">TLV</span> · ${L('15:05')}`)}
        <div class="li"><span class="linkrow">+ הוספת טיסה</span></div></div>
      <div class="help">טיסות נשמרות מיד, בנפרד מ"שמירת השינויים".</div>
      <div class="label" style="margin-top:24px">ערים</div>
      <div class="list"><div class="li"><span class="grow body">(1) בנגקוק</span></div><div class="li"><span class="linkrow">+ הוספת עיר</span></div></div>
      <div class="label" style="margin-top:24px">טיסות (בנסיעה חדשה)</div>
      <div class="help" style="margin-top:0">אפשר להוסיף טיסות אחרי ששומרים את הנסיעה.</div>
    </div><div class="footer"><button class="btn pri">שמירת השינויים</button></div><div class="navbar"></div></div>`;
}

function phone(title, sub, inner, opts = {}) {
  const dir = opts.ltrAware && S.lang === 'en' ? 'ltr' : 'rtl';
  return `<figure><figcaption>${title}<small>${sub}</small></figcaption>
    <div class="phone ${opts.flat ? 'flat' : ''} ${S.theme}-vars" dir="${dir}">${inner}${opts.flat ? '' : '<div class="navbar"></div>'}</div></figure>`;
}

function render() {
  document.body.className = (S.theme === 'dark' ? 'dark' : '') + (S.scale >= 1.6 ? ' big' : '');
  document.documentElement.style.setProperty('--s', S.scale);
  const t = T[S.lang];
  const g = document.getElementById('grid');
  g.innerHTML = [
    phone('1. כרטיס: נסיעה פתוחה עם שתי טיסות', 'testID: card-flights, card-flight-${id}. החליפו "מצב הטיסה" בפאנל. ב-200% העמודות נערמות (9.9).', card(flightsSection(t)), { ltrAware: true }),
    phone('2. גיליון הטיסה', 'פרטים, היסטוריה (כשיש שינויים), קוד הזמנה מוסתר. "הצגה" עובד. testID: flight-sheet.', card(flightsSection(t)) + flightSheet(), { ltrAware: true }),
    phone('3. נסיעה בלי טיסות (ריק)', 'testID: card-flight-add, card-flights-empty-help. בלי קרדיט.', card(flightsSection(t, { empty: true })), { ltrAware: true }),
    phone('4. טעינה ושגיאת מעקב', 'הערכים השמורים מיד, שלד במקום התגים ושורת המעקב. testID: card-flight-${id}-skeleton, card-flights-retry.', card(flightsSection(t, { loading: true })), { ltrAware: true }),
    phone('5. בלי רשת: קריאה בלבד', 'מהעותק המוצפן. "הוספת טיסה" חסומה אבל מסבירה. testID: card-flight-readonly.', card(flightsSection(t, { cached: true }), { cached: true }), { ltrAware: true }),
    phone('6. הוספת טיסה, שלב 1', 'כיוון, מספר ותאריך. testID: flight-number, flight-date, flight-search, flight-manual.', step1(), { flat: true }),
    phone('7. "מחפשים…" ובחירת קטע', 'משמאל: אחרי החיפוש, כשיש כמה קטעים. testID: flight-legs, flight-leg-0.', step1({ legs: true }), { flat: true }),
    phone('8. שלב 2: מולא, עם "אין נתון"', 'השער והטרמינל בנחיתה חסרים. testID: flight-notice-found.', step2(false), { flat: true }),
    phone('9. שלב 2: ידני, עם אזהרות ושגיאות', 'טיסה שעברה, מחוץ לנסיעה, דילוג שעון (אזהרות), יעד חסר וקוד הזמנה לא תקין (שגיאות). כולן יחד להדגמה, גם כשהתאריכים לא מתיישבים זה עם זה.', step2(true), { flat: true }),
    phone('10. בחירת שדה תעופה', 'בלי שאילתה: שדות במדינה, ואז ישראל. testID: airport-result-BKK.', airportPicker(), { flat: true }),
    phone('11. "להוסיף גם את טיסת החזור?"', 'אחרי שמירת הלוך, רק כשאין חזור. testID: return-prompt-add / -later.', card(flightsSection(t)) + returnPrompt()),
    phone('12. טופס הנסיעה: מקטע "טיסות"', 'בעריכה: רשימה לחיצה. בנסיעה חדשה: שורת עזרה בלבד.', tripForm(), { flat: true }),
  ].join('');
  const b = document.getElementById('pnrBtn');
  if (b) b.onclick = () => { S.pnrShown = !S.pnrShown; render(); };
}
for (const id of ['theme', 'scale', 'lang', 'state']) {
  document.getElementById(id).onchange = (e) => { S[id] = id === 'scale' ? Number(e.target.value) : e.target.value; render(); };
}
render();
</script>
</body>
</html>
