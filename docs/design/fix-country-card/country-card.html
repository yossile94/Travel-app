<style>

  /* new: status row */

  /* new: tear + tiles */
  .tear { position: relative; border-top: 2px dashed var(--tear); margin: 0 15px; }
  .tear::before, .tear::after { content: ""; position: absolute; top: -12px; width: 22px; height: 22px; border-radius: 50%; background: #0A1A3C; }
  .tear::before { right: -26px; } .tear::after { left: -26px; }
  .tiles { padding: 12px 16px 4px; display: grid; gap: 8px; }
  .tile { position: relative; min-height: calc(76px * var(--tileH, 1)); border-radius: 12px; background: var(--tag); display: flex; flex-direction: column;

  .iconsOnly .tile { min-height: 64px; }
  .badge { position: absolute; top: 6px; inset-inline-end: 6px; width: 20px; height: 20px; border-radius: 50%; background: var(--raised);

  .tileList { padding: 8px 16px 4px; }
  .lrow { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 4px; border-bottom: 1px solid var(--border); cursor: pointer; }

  .appbar { display: flex; align-items: center; gap: 4px; min-height: 56px; padding: 32px 8px 0 16px; }

<body>
<header class="top">
  <h1>תיקון: כרטיס מדינה רגוע יותר</h1>
  <p>לפני ואחרי, לתאילנד (עם אזהרה) ולפורטוגל (בלי אזהרה), ומצבים נוספים. המפרט המלא ב-README.md שבאותה תיקייה. <b>כל הנתונים כאן להדגמה בלבד</b>: שערים, רמות, טמפרטורות וסטטוסי כניסה אינם נתונים אמיתיים ואינם קביעה לגבי מדינה כלשהי.</p>
</header>
<div class="panel">

    <select id="theme"><option value="light">בהיר</option><option value="dark">כהה</option></select></label>

  <span style="opacity:.75">ב-200% הרצועה הופכת לרשימה (README 5.4).</span>

<script>
const $ = (s) => document.querySelector(s);
const state = { theme: 'light', s: 1, mode: 'value' };

// ---------------------------------------------------------------- icons (24 viewBox, stroke 2)
const P = {
  clock: 'M12 3a9 9 0 100 18 9 9 0 000-18zm0 4v5l3 2',
  money: 'M3 7h18v10H3zM12 9.5a2.5 2.5 0 100 5 2.5 2.5 0 000-5zM6.5 12h.01M17.5 12h.01',
  thermo: 'M10 13.8V5a2 2 0 114 0v8.8a4 4 0 11-4 0zM12 9v6.5',
  pin: 'M12 21s-6.5-5.7-6.5-11a6.5 6.5 0 1113 0c0 5.3-6.5 11-6.5 11zM12 7.5a2.5 2.5 0 100 5 2.5 2.5 0 000-5z',
  phone: 'M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z',
  chevEnd: 'M15 6l-6 6 6 6',           // RTL: the end is on the left
  back: 'M9 6l6 6-6 6',                // RTL back points right
  x: 'M6 6l12 12M18 6L6 18',
  cloudOff: 'M7 18h10a4 4 0 00.8-7.9A6 6 0 006.3 9 4.5 4.5 0 007 18zM3 3l18 18',
  hourglass: 'M7 3h10M7 21h10M8 3c0 5 8 5 8 9s-8 4-8 9M16 3c0 5-8 5-8 9s8 4 8 9',
  noEntry: 'M12 3a9 9 0 100 18 9 9 0 000-18zM7 12h10',
  warn: 'M12 4l9 16H3zM12 10v4M12 17v.5',
  calc: 'M6 3h12v18H6zM9 7h6M9 12h.01M12 12h.01M15 12h.01M9 16h.01M12 16h.01M15 16h.01',
  plus: 'M12 5v14M5 12h14',
  chevDown: 'M6 9l6 6 6-6',
  search: 'M11 4a7 7 0 100 14 7 7 0 000-14zM20 20l-4-4',
  ext: 'M14 4h6v6M20 4l-9 9M18 14v6H4V6h6',
};
const ic = (n, size = 24, color = 'currentColor') =>
  `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${P[n]}"/></svg>`;

// ---------------------------------------------------------------- demo data
const WORD = { 1: 'אין אזהרת מסע', 2: 'איום מזדמן', 3: 'איום בינוני', 4: 'איום גבוה' };
const REC = { 1: 'זהירות רגילה', 2: 'זהירות מוגברת', 3: 'להימנע מנסיעות שאינן חיוניות', 4: 'להימנע מהגעה' };
const C = {
  tha: { he: 'תאילנד', en: 'THAILAND', code: 'THA', level: 4, mixed: true, entry: null, time: '14:32', city: 'בנגקוק',
    diff: '4 שעות יותר מבישראל', cur: 'באט תאילנדי', sym: '฿', iso: 'THB', rate: '1 THB = 0.11 ₪ · 0.034 $', src: 'erapi',
    updated: '28.10.2026', checked: '28.10.2026', temp: '28°', tempA11y: '28 מעלות', cities: ['בנגקוק', "צ'יאנג מאי", 'קוסמוי', 'פוקט', 'פטאיה'] },
  prt: { he: 'פורטוגל', en: 'PORTUGAL', code: 'PRT', level: 1, mixed: false, entry: null, time: '12:32', city: 'ליסבון',
    diff: 'שעתיים פחות מבישראל', cur: 'אירו', sym: '€', iso: 'EUR', rate: '1 EUR = 3.9 ₪ · 1.1 $', src: 'boi',
    updated: '28.10.2026', checked: '28.10.2026', temp: '19°', tempA11y: '19 מעלות', cities: ['ליסבון', 'פורטו'] },
  mdv: { he: 'המלדיביים', en: 'MALDIVES', code: 'MDV', level: 1, mixed: false, entry: 'banned', time: '16:32', city: 'מאלה',
    diff: '3 שעות יותר מבישראל', cur: 'רופיה מלדיבית', sym: '.ރ', iso: 'MVR', rate: '1 MVR = 0.24 ₪ · 0.065 $', src: 'erapi',
    updated: '28.10.2026', checked: '28.10.2026', temp: '28°', tempA11y: '28 מעלות', cities: ['מאלה'] },
};

// ---------------------------------------------------------------- shared parts
const bar = (level, cls = '') => {
  let h = `<span class="bar ${cls}" aria-hidden="true">`;
  for (let n = 1; n <= 4; n++) h += n <= level ? `<i style="background:var(--l${level});border-color:var(--l${level})"></i>` : '<i></i>';
  return h + '</span>';
};
const levelText = (c) => `${c.mixed ? 'עד ' : ''}רמה ${c.level} · ${WORD[c.level]}`;
const entryTag = (e) => e === 'banned'
  ? `<span class="pill banned">${ic('noEntry', 12)}אין כניסה</span>`
  : e === 'restricted' ? `<span class="pill restricted">${ic('warn', 12)}כניסה מוגבלת</span>` : '';
const header = (c) => `
  <div class="strip"></div>
  <p class="caption">יעד</p>
  <p class="name" role="heading">${c.he}</p>
  <p class="nameEn">${c.en}</p>`;
const stub = (c) => `<div class="stub"><span class="code" aria-label="קוד המדינה ${c.code}">${c.code}</span><span class="barcode" aria-hidden="true"></span></div>`;
const closeBtn = `<span class="close" role="button" aria-label="סגירה">${ic('x', 20)}</span>`;
const coupon = (opts = {}) => opts.signedOut ? `
  <div class="coupon"><button class="btn cta">${ic('plus', 20)}נסיעה חדשה</button></div>` : `
  <div class="coupon">
    <p class="caption" role="heading">הנסיעות שלך</p>
    <div class="tripRow active"><div class="grow">
      <p class="body strong">${opts.trip || 'חופשה משפחתית'}</p>
      <p class="footnote tnum"><span class="ltr">20.12</span> – <span class="ltr">3.1.2027</span></p>
      <span class="stTag" style="background:var(--planBg);color:var(--planFg)">מתוכננת</span>
    </div><span class="t3">${ic('chevDown', 20)}</span></div>
    <button class="btn cta">${ic('plus', 20)}נסיעה חדשה</button>
  </div>`;

// ---------------------------------------------------------------- BEFORE (the card today)
function beforeCard(c) {
  const sources = `<p class="footnote link" style="margin-top:8px">מקורות</p>`;
  return `<div class="card">
    <div class="pass"><div class="main">
      ${header(c)}
      ${c.entry ? `<div style="margin-top:8px">${entryTag(c.entry)}</div>` : ''}
      <div class="block"><p class="caption">אזהרת מסע של המל"ל</p>
        <div class="press">${bar(c.level)}<span class="callout grow ${c.level === 4 ? 'alertT strong' : ''}">${levelText(c)}</span>${ic('chevEnd', 16, 'var(--t3)')}</div>
        ${c.mixed ? '<p class="footnote">הרמה משתנה לפי אזור</p>' : ''}
        <p class="footnote">נבדק ב-<span class="ltr">${c.checked}</span></p></div>
      <div class="fields">
        <div><p class="caption">שעה מקומית · ${c.city}</p><p class="clock ltr">${c.time}</p><p class="sub">${c.diff}</p></div>
        <div><p class="caption">מטבע</p><p class="value">${c.cur}</p><p class="sub ltr">${c.sym} · ${c.iso}</p></div>
      </div>
      <div class="block"><p class="caption">שער חליפין</p>
        <div class="press"><span class="numeric grow ltr" style="text-align:right">${c.rate}</span>${ic('calc', 20, 'var(--t2)')}</div>
        <p class="footnote">עודכן ב-<span class="ltr">${c.updated}</span></p>
        ${c.src === 'boi' ? '<p class="footnote">מקור: בנק ישראל</p>' : '<p class="footnote link ltr" style="text-align:right">Rates By Exchange Rate API</p>'}</div>
      <div style="margin-top:20px"><p class="caption">ממוצע יומי באוקטובר</p><p class="numeric">${c.temp}</p><p class="sub">${c.city}</p></div>
      <div class="press" style="margin-top:8px;min-height:56px"><span class="t2">${ic('pin', 24)}</span><div class="grow"><p class="body">מה לראות ב${c.he}</p><p class="footnote">מקומות מובילים לפי קטגוריה</p></div>${ic('chevEnd', 16, 'var(--t3)')}</div>
      ${sources}
    </div>${stub(c)}</div>
    <div class="tear" style="margin:0 15px"></div>
    ${closeBtn}
    ${coupon()}
  </div>`;
}

// ---------------------------------------------------------------- AFTER
function statusRow(c, o = {}) {
  if (o.loading) return `<div class="status static" aria-hidden="true"><span class="skel" style="width:57px;height:16px"></span><span class="skel" style="width:140px;height:12px"></span></div>`;
  if (o.offlineFirst) return `<div class="status static" role="text" aria-label="אזהרות המסע יוצגו כשיהיה חיבור"><span class="t2">${ic('cloudOff', 16)}</span><span class="body t2">אזהרות המסע יוצגו כשיהיה חיבור</span></div>`;
  const a11y = [c.entry === 'banned' ? 'אין כניסה בדרכון ישראלי' : null,
    `אזהרת מסע של המל"ל: ${c.mixed ? 'עד ' : ''}רמה ${c.level} מתוך 4, ${WORD[c.level]}`, c.mixed ? 'הרמה משתנה לפי אזור' : null,
    `נבדק ב-${c.checked}`].filter(Boolean).join(', ');
  const second = [c.mixed ? '<span class="footnote">הרמה משתנה לפי אזור</span>' : '', o.staleAdvisory ? '<span class="pill stale">ייתכן שלא מעודכן</span>' : ''].join('');
  return `<div class="status" role="button" aria-label="${a11y}" title="פותח פרטים ומקור" data-open="travel">
      ${entryTag(c.entry)}
      <span class="lvl">${bar(c.level)}<span class="callout ${c.level === 4 ? 'alertT strong' : ''}">${levelText(c)}</span></span>
      <span class="t3" style="margin-inline-start:auto">${ic('chevEnd', 16)}</span>
    </div>
    ${second ? `<div class="second">${second}</div>` : ''}`;
}

function tileDefs(c, o) {
  const t = [];
  t.push({ id: 'time', icon: 'clock', label: 'שעה', value: `<span class="ltr">${c.time}</span>`,
    a11y: `שעה מקומית ב${c.city}: ${c.time}, ${c.diff}`, open: 'time' });
  t.push({ id: 'money', icon: 'money', label: 'מטבע', value: `<span class="ltr">${c.iso}</span>`,
    a11y: o.offlineFirst ? `מטבע: ${c.cur}. השער יוצג כשיהיה חיבור` : `מטבע: ${c.cur}. שער חליפין: ${c.rate}${o.staleRate ? ', ייתכן שלא מעודכן' : ''}`,
    badge: o.offlineFirst ? 'cloudOff' : o.staleRate ? 'hourglass' : null, open: 'money' });
  t.push({ id: 'climate', icon: 'thermo', label: 'טמפרטורה', value: o.loading ? '<span class="skel" style="display:inline-block;width:32px;height:16px"></span>' : `<span class="ltr">${c.temp}</span>`,
    a11y: `ממוצע יומי באוקטובר: ${c.tempA11y}, ${c.city}`, open: 'climate' });
  t.push({ id: 'places', icon: 'pin', label: 'מה לראות', a11y: `מה לראות ב${c.he}`, open: o.signedOut ? 'placesNoTrip' : 'placesTrip' });
  if (o.signedOut) t.push({ id: 'emergency', icon: 'phone', label: 'חירום', a11y: `חירום ב${c.he}`, color: 'var(--alert)' });
  return t;
}

function tiles(c, o = {}) {
  const defs = tileDefs(c, o);
  const s = state.s;
  const iconsOnly = state.mode === 'icons';
  if (s >= 1.6) {
    return `<div class="tileList" data-testid="card-tiles">${defs.map((d) => `
      <div class="lrow" role="button" aria-label="${d.a11y}" data-open="${d.open || ''}">
        <span style="color:${d.color || 'var(--t1)'}">${ic(d.icon, 24)}</span>
        <span class="body grow">${d.label}</span>
        ${d.value && !iconsOnly ? `<span class="numeric">${d.value}</span>` : ''}
        ${d.badge ? `<span class="t2">${ic(d.badge, 16)}</span>` : ''}
        <span class="t3">${ic('chevEnd', 16)}</span></div>`).join('')}</div>`;
  }
  const n = defs.length;
  const maxCols = Math.max(1, Math.floor(355 / (64 * s)));
  const rows = Math.ceil(n / maxCols);
  const cols = Math.ceil(n / rows);
  const tpl = n <= 2 ? `repeat(${n}, minmax(64px, 112px))` : `repeat(${cols}, 1fr)`;
  return `<div class="tiles enter ${iconsOnly ? 'iconsOnly' : ''}" style="grid-template-columns:${tpl}" data-testid="card-tiles">${defs.map((d, i) => `
    <div class="tile" role="button" aria-label="${d.a11y}" data-open="${d.open || ''}" style="animation-delay:${i * 30}ms" data-testid="card-tile-${d.id}">
      <span style="color:${d.color || 'var(--t1)'}">${ic(d.icon, 24)}</span>
      ${d.value && !iconsOnly ? `<span class="tv">${d.value}</span><span class="tl">${d.label}</span>` : `<span class="tl only">${d.label}</span>`}
      ${d.badge ? `<span class="badge">${ic(d.badge, 12)}</span>` : ''}
    </div>`).join('')}</div>
    <div class="sourcesNew"><span class="footnote link">מקורות</span></div>`;
}

function afterCard(c, o = {}) {
  return `<div class="card">
    <div class="pass"><div class="main">
      ${header(c)}
      ${statusRow(c, o)}
      ${o.match ? `<div class="block"><p class="caption">למה מתאים</p><div class="chips"><span class="chip">אזהרה רמה ${c.level}</span><span class="chip">כניסה מותרת</span><span class="chip">${c.temp} באוקטובר</span><span class="chip">כ-4 שעות טיסה</span></div></div>` : ''}
    </div>${stub(c)}</div>
    <div class="tear"></div>
    ${tiles(c, o)}
    <div class="tear"></div>
    ${closeBtn}
    ${coupon(o)}
  </div>`;
}

// ---------------------------------------------------------------- sheets
const sheetShell = (title, sub, body) => `<div class="scrim"></div><div class="sheet" role="dialog" aria-label="${title}">
  <div class="handle"></div>
  <div class="sheetHead"><div class="grow"><p class="title2" role="heading">${title}</p>${sub ? `<p class="callout t2">${sub}</p>` : ''}</div><span class="x" role="button" aria-label="סגירה">${ic('x', 20)}</span></div>
  ${body}</div>`;

function timeSheet(c) {
  return sheetShell('שעה מקומית', c.he, `
    <p class="numLg ltr" style="text-align:right">${c.time}</p>
    <p class="callout t2">${c.city}</p>
    <p class="body" style="margin-top:8px">${c.diff}</p>`);
}
function moneySheet(c, o = {}) {
  const attr = c.src === 'boi' ? '<p class="footnote">מקור: בנק ישראל</p>' : '<p class="footnote link ltr" style="text-align:right">Rates By Exchange Rate API</p>';
  const head = `<p class="callout t2"><span>${c.cur}</span> · <span class="ltr">${c.sym}</span> · <span class="ltr">${c.iso}</span></p>`;
  if (o.offlineFirst) return sheetShell('מטבע ושער חליפין', '', head + `<div class="wrapRow" style="margin-top:16px"><span class="t2">${ic('cloudOff', 16)}</span><span class="body t2">השער יוצג כשיהיה חיבור</span></div>`);
  const field = (label, val, unit) => `<div class="field"><p class="caption">${label}</p><div class="inputWrap"><input value="${val}" inputmode="decimal" aria-label="${label}, סכום"><span class="callout t2" style="margin-inline-start:8px">${unit}</span></div></div>`;
  return sheetShell('מטבע ושער חליפין', '', head + `
    <p class="numeric ltr" style="text-align:right;margin-top:12px">${c.rate}</p>
    <div class="wrapRow"><span class="footnote">עודכן ב-<span class="ltr">${c.updated}</span></span>${o.staleRate ? '<span class="pill stale">ייתכן שלא מעודכן</span>' : ''}</div>
    ${attr}
    <hr>
    ${field(`${c.cur} · ${c.iso}`, '1', c.iso)}
    ${field('שקל חדש · ILS', c.iso === 'THB' ? '0.11' : c.iso === 'EUR' ? '3.9' : '0.24', '₪')}
    ${field('דולר אמריקאי · USD', c.iso === 'THB' ? '0.034' : c.iso === 'EUR' ? '1.1' : '0.065', '$')}
    <p class="footnote" style="margin-top:16px">שער להמחשה בלבד; השער בבנק או בצ'יינג' יהיה שונה</p>
    <p class="caption t3" style="margin-top:8px">בלי פוקוס אוטומטי: המקלדת נפתחת בהקשה על שדה (README 6.3, שאלה 4).</p>`);
}
function climateSheet(c) {
  return sheetShell('טמפרטורה', 'ממוצע יומי באוקטובר', `
    <p class="numLg ltr" style="text-align:right">${c.temp}</p>
    <p class="callout t2">${c.city}</p>
    <p class="body" style="margin-top:12px">ממוצע רב-שנתי (1991–2020), לא תחזית.</p>
    <p class="footnote" style="margin-top:16px">נתוני אקלים: CRU TS v4.08, Climatic Research Unit, University of East Anglia, דרך CEDA, רישיון Open Government Licence v3.0.</p>`);
}
function travelSheet(c) {
  return sheetShell('כניסה ואזהרות מסע', c.he, `
    <p class="title2" style="font-size:calc(18px*var(--s));margin-top:16px" role="heading">אזהרת מסע של המל"ל</p>
    ${bar(c.level, 'lg')}
    <p class="body strong">${c.mixed ? 'עד ' : ''}רמה ${c.level} מתוך 4</p>
    <p class="body">${WORD[c.level]}: ${REC[c.level]}</p>
    ${c.mixed ? '<p class="footnote">הרמה משתנה לפי אזור. הפירוט בטקסט למטה.</p>' : ''}
    <p class="footnote">נבדק ב-<span class="ltr">${c.checked}</span></p>
    <p class="caption" style="margin-top:16px">המל"ל</p>
    <p class="body">[טקסט ההנחיה של המל"ל, עד 8 שורות ואז "עוד". להדגמה בלבד.]</p>
    <button class="btn sec">${ic('ext', 20)}לעמוד הרשמי ב-gov.il</button>
    <p class="footnote" style="margin-top:16px">המידע מבוסס על פרסומי המל"ל ומשרד החוץ, ואינו מחליף בדיקה במקור הרשמי</p>
    <p class="footnote" style="margin-top:8px"><span style="background:#C4F1EA;color:#084F48;border-radius:4px;padding:0 4px">חדש</span> אזהרות מסע: המאגר "אזהרות מסע" של gov.il באתר data.gov.il, לפי פרסומי המל"ל ומשרד החוץ. הרמה בסרגל זוהתה על ידינו מתוך הטקסט.</p>`);
}

// ---------------------------------------------------------------- screens
function phone(inner, opts = {}) {
  return `<div class="phone ${opts.app ? 'app' : ''} ${state.theme}-vars"><span class="demo">להדגמה בלבד</span>${inner}<div class="navbar"></div></div>`;
}
function fig(kind, title, sub, inner, note) {
  return `<figure><figcaption>${kind ? `<span class="tagBA ${kind}">${kind === 'before' ? 'לפני' : 'אחרי'}</span>` : ''}${title}<small>${sub}</small>${note ? `<div class="note">${note}</div>` : ''}</figcaption>${inner}</figure>`;
}

function render() {
  document.body.className = state.theme === 'dark' ? 'dark' : '';
  document.documentElement.style.setProperty('--s', state.s);
  const t = C.tha, p = C.prt, m = C.mdv;
  const sec = (h, figs) => `<h2 class="sec">${h}</h2><div class="grid">${figs.join('')}</div>`;
  $('#root').innerHTML =
    sec('א. לפני ואחרי', [
      fig('before', '1 · תאילנד היום', '10 בלוקים בעמודה אחת. הכרטיס עובר למצב גלילה כבר ב-100%, והקופון נדחק מתחת לקצה.', phone(beforeCard(t))),
      fig('after', '2 · תאילנד אחרי', 'כותרת עם שורת סטטוס אחת (רמה 4, אזורית), רצועת אייקונים ברוחב מלא, והקופון גלוי.', phone(afterCard(t))),
      fig('before', '3 · פורטוגל היום', 'גם בלי אזהרה, הכרטיס מלא בתוויות.', phone(beforeCard(p))),
      fig('after', '4 · פורטוגל אחרי', 'רמה 1 בשורה אחת, בלי שורה שנייה. אותם אייקונים, באותו סדר.', phone(afterCard(p))),
    ]) +
    sec('ב. מצבים', [
      fig('after', '5 · בלי התחברות', '"חירום" מצטרף כאייקון חמישי (במקום השורה "חירום ב[מדינה]"). ב-130% יש 3 + 2.', phone(afterCard(t, { signedOut: true }))),
      fig('after', '6 · "אין כניסה"', 'התג האדום המלא קודם לרמה, באותה שורה. אין סביבו עומס, ולכן הוא בולט יותר מהיום.', phone(afterCard(m))),
      fig('after', '7 · טעינה', 'שלד בשורת הסטטוס ובערך הטמפרטורה, אחרי 150ms. השעה והמטבע מיד, כי הם ארוזים באפליקציה.', phone(afterCard(t, { loading: true }))),
      fig('after', '8 · התקנה ראשונה בלי רשת', 'שורת הסטטוס אומרת את זה במילים. על המטבע תג "בלי רשת". השעה והטמפרטורה עובדות.', phone(afterCard(t, { offlineFirst: true }))),
      fig('after', '8א · בלי רשת, שמירה ישנה', 'שמירה מלפני 5 ימים: תג "ישן" על המטבע (מעל 3 ימים). האזהרה עדיין מתחת ל-30 יום, ולכן בלי תג.', phone(afterCard(t, { staleRate: true }))),
      fig('after', '8ב · אזהרה ישנה מ-30 יום', 'התג "ייתכן שלא מעודכן" נשאר בכותרת: מידע בטיחות ישן חייב להיראות.', phone(afterCard(p, { staleAdvisory: true }))),
      fig('after', '8ג · מצב גילוי', '"למה מתאים" נשאר בכרטיס, מתחת לשורת הסטטוס.', phone(afterCard(p, { match: true }))),
    ]) +
    sec('ג. מה נפתח מכל אייקון', [
      fig('after', '9 · שעה', 'גיליון חדש וקטן: השעה, העיר וההפרש מישראל.', phone(afterCard(t) + timeSheet(t))),
      fig('after', '10 · מטבע', 'המחשבון הקיים, עם ראש: המטבע, השער, "עודכן ב-" והייחוס.', phone(afterCard(t, { staleRate: true }) + moneySheet(t, { staleRate: true }))),
      fig('after', '10א · מטבע בלי רשת', 'התקנה ראשונה: הראש, וההודעה. בלי שדות.', phone(afterCard(t, { offlineFirst: true }) + moneySheet(t, { offlineFirst: true }))),
      fig('after', '11 · טמפרטורה', '"ממוצע רב-שנתי, לא תחזית", ושורת המקור.', phone(afterCard(t) + climateSheet(t))),
      fig('after', '12 · כניסה ואזהרות מסע', 'הגיליון הקיים, משורת הסטטוס. תוספת אחת: שורת המקור בסוף.', phone(afterCard(t) + travelSheet(t))),
    ]);
}

$('#theme').addEventListener('change', (e) => { state.theme = e.target.value; render(); });
$('#scale').addEventListener('change', (e) => { state.s = Number(e.target.value); render(); });
$('#mode').addEventListener('change', (e) => { state.mode = e.target.value; render(); });
render();
</script>
</body>
</html>
