<style>
/* ---------- tokens (tokens.json 0.2.0 + tokens-0.3.0.proposed.json) ---------- */
:root {
  --font: 'Rubik Variable', 'Rubik', system-ui, 'Segoe UI', Arial, sans-serif;
  --sysfont: Roboto, 'Noto Sans Hebrew', 'Segoe UI', Arial, sans-serif;
  --fs: 1; --top: 28px; --bottom: 48px; --scale: 1;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --ease-decel: cubic-bezier(0.05, 0.7, 0.1, 1);
  --ease-accel: cubic-bezier(0.3, 0, 0.8, 0.15);
  --space: #03060F; --trip: #4FCFBE; --sel: #FF7A57;
}
:root[dir="rtl"] { --push-from: -100%; }
:root[dir="ltr"] { --push-from: 100%; }
:root[data-theme="light"] {
  --canvas: #FFFBF5; --surface: #FFFFFF; --raised: #FFFFFF; --alt: #FBF4E8;
  --t1: #121C36; --t2: #4A5573; --t3: #646E8A; --link: #1561BC; --alert: #C81E16;
  --pri-bg: #1561BC; --pri-fg: #FFFFFF; --pri-pressed: #104C94;
  --cta-bg: #C8441F; --cta-fg: #FFFFFF; --cta-pressed: #A8381A;
  --sec-bg: #EEF6FF; --sec-fg: #104C94; --dis-bg: #E9EEFA; --dis-fg: #646E8A;
  --ok-bg: #0B7F73; --ok-sbg: #E8FAF7; --ok-sfg: #0A665D;
  --bsub: #F4E7D0; --bctl: #7D869E; --focus: #1F78DB;
  --info-bg: #EEF6FF; --info-fg: #104C94; --pressed: #FBF4E8; --chip: #FBF4E8; --skel: #F4E7D0;
  --scrim: rgba(6,11,24,0.48);
  --chrome-bg: rgba(255,255,255,0.92); --chrome-fg: #121C36; --chrome-b: rgba(18,28,54,0.08);
  --g-bg: #FFFFFF; --g-b: #747775; --g-fg: #1F1F1F;
  --field-b: transparent; --perf: rgba(18,28,54,.22);
  --sh2: 0 4px 12px rgba(18,28,54,0.10), 0 1px 3px rgba(18,28,54,0.06);
  --sh3: 0 8px 24px rgba(18,28,54,0.14);
  --page: #EDE6D9; --sys-bg: #FFFFFF; --sys-fg: #1F1F1F; --sys-2: #444746; --sys-acc: #0B57D0;
}
:root[data-theme="dark"] {
  --canvas: #060B18; --surface: #0B1326; --raised: #121C36; --alt: #121C36;
  --t1: #F3F6FC; --t2: #A3B3DB; --t3: #7487BD; --link: #6FB3FA; --alert: #FF5D52;
  --pri-bg: #6FB3FA; --pri-fg: #060B18; --pri-pressed: #A9D2FF;
  --cta-bg: #FF7A57; --cta-fg: #060B18; --cta-pressed: #FF9677;
  --sec-bg: #1A2749; --sec-fg: #A9D2FF; --dis-bg: #1A2749; --dis-fg: #7487BD;
  --ok-bg: #4FCFBE; --ok-sbg: #0D2B2E; --ok-sfg: #8FE3D6;
  --bsub: #1A2749; --bctl: #7487BD; --focus: #6FB3FA;
  --info-bg: #1A2749; --info-fg: #A9D2FF; --pressed: #1A2749; --chip: #1A2749; --skel: #1A2749;
  --scrim: rgba(0,0,0,0.6);
  --chrome-bg: rgba(18,28,54,0.88); --chrome-fg: #F3F6FC; --chrome-b: rgba(163,179,219,0.32);
  --g-bg: #131314; --g-b: #8E918F; --g-fg: #E3E3E3;
  --field-b: #1A2749; --perf: rgba(244,231,208,.22);
  --sh2: none; --sh3: none;
  --page: #03060E; --sys-bg: #2B2D31; --sys-fg: #E3E3E3; --sys-2: #C4C7C5; --sys-acc: #A8C7FA;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { font-family: var(--font); background: var(--page); color: var(--t1); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.ltr { direction: ltr; unicode-bidi: isolate; }
.num { font-variant-numeric: tabular-nums; }
svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.s20 { width: 20px; height: 20px; } svg.i.s16 { width: 16px; height: 16px; }
:root[dir="rtl"] .dir { transform: scaleX(-1); }

/* ---------- stage ---------- */
.stage { display: flex; gap: 28px; padding: 16px; align-items: flex-start; justify-content: center; flex-wrap: wrap; }
.phone-slot { position: relative; width: calc(431px * var(--scale)); height: calc(934px * var(--scale)); flex: none; }
.bezel { position: absolute; top: 0; left: 0; width: 431px; height: 934px; padding: 10px; border-radius: 52px; background: #10131A; transform: scale(var(--scale)); transform-origin: 0 0; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.phone { position: relative; width: 411px; height: 914px; overflow: hidden; border-radius: 42px; background: var(--space); }
canvas#globe { position: absolute; inset: 0; width: 411px; height: 914px; touch-action: none; cursor: grab; }
.veil { position: absolute; inset: 0; background: var(--space); opacity: 0; pointer-events: none; z-index: 1; }
.scrim-top { position: absolute; top: 0; left: 0; right: 0; height: calc(var(--top) + 16px); z-index: 2; pointer-events: none; background: linear-gradient(to bottom, rgba(3,6,15,.6) 0, rgba(3,6,15,.5) var(--top), rgba(3,6,15,0) 100%); }
.scrim-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: calc(var(--bottom) + 24px); z-index: 2; pointer-events: none; background: linear-gradient(to top, rgba(3,6,15,.6) 0, rgba(3,6,15,.5) var(--bottom), rgba(3,6,15,0) 100%); }
.statusbar { position: absolute; top: 0; left: 0; right: 0; height: var(--top); z-index: 60; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; color: #fff; font: 500 13px/1 var(--sysfont); pointer-events: none; direction: ltr; }
.statusbar.dark { color: #1F1F1F; }
.navbar { position: absolute; bottom: 0; left: 0; right: 0; height: var(--bottom); z-index: 60; display: flex; align-items: center; justify-content: space-around; color: #fff; direction: ltr; }
.navbar.dark { color: #1F1F1F; }
.navbar button { background: none; border: 0; width: 64px; height: 44px; display: grid; place-items: center; cursor: pointer; color: inherit; }
.navbar svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }
.mapbox { position: absolute; top: calc(var(--top) + 12px); left: 12px; z-index: 3; display: flex; align-items: center; gap: 6px; direction: ltr; color: #fff; font: 700 15px/1 Arial, sans-serif; opacity: .9; pointer-events: none; }
.mapbox .attrib { width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,.85); color: #121C36; font: 700 13px/24px Georgia, serif; text-align: center; }

/* ---------- chrome ---------- */
.chrome { position: absolute; top: calc(var(--top) + 52px); width: 48px; height: 48px; border-radius: 999px; border: 1px solid var(--chrome-b); background: var(--chrome-bg); color: var(--chrome-fg); box-shadow: var(--sh2); display: grid; place-items: center; cursor: pointer; z-index: 6; padding: 0; transition: opacity 150ms var(--ease-accel), transform 100ms var(--ease-standard); }
.chrome:active { transform: scale(0.96); }
.chrome.search { inset-inline-start: 12px; } .chrome.acct { inset-inline-end: 12px; }
.chrome.gone { opacity: 0; pointer-events: none; visibility: hidden; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--pri-bg); color: var(--pri-fg); display: grid; place-items: center; font-weight: 600; font-size: 18px; line-height: 1; }
.avatar.md { width: 48px; height: 48px; font-size: 22px; flex: none; }
.trips-btn { position: absolute; bottom: calc(var(--bottom) + 16px); left: 50%; transform: translateX(-50%); z-index: 5; min-height: 48px; padding: 0 20px; display: flex; align-items: center; gap: 8px; border-radius: 999px; border: 1px solid var(--chrome-b); background: var(--chrome-bg); color: var(--chrome-fg); box-shadow: var(--sh2); cursor: pointer; font-weight: 500; font-size: calc(16px * var(--fs)); line-height: calc(24px * var(--fs)); white-space: nowrap;
  transition: transform 320ms var(--ease-decel), opacity 320ms var(--ease-decel); }
.trips-btn:active { transform: translateX(-50%) scale(.96); }
.trips-btn.gone { transform: translate(-50%, 80px); opacity: 0; pointer-events: none; transition: transform 200ms var(--ease-accel), opacity 200ms var(--ease-accel); }
:root[data-reduce] .trips-btn, :root[data-reduce] .trips-btn.gone { transform: translateX(-50%); transition: opacity 200ms linear; }

/* ---------- search (minimal, sprint 1) ---------- */
.sb { position: absolute; top: calc(var(--top) + 52px); inset-inline: 12px; min-height: 48px; border-radius: 999px; z-index: 8; background: var(--raised); color: var(--t1); border: 2px solid var(--focus); display: flex; align-items: center; }
.sb button { flex: none; width: 48px; height: 44px; border: 0; background: none; display: grid; place-items: center; cursor: pointer; }
.sb input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: calc(16px * var(--fs)); padding: 10px 0; }
.search-scrim { position: absolute; top: calc(var(--top) + 108px); left: 0; right: 0; bottom: 0; background: rgba(3,6,15,0.40); z-index: 7; }
.results { position: absolute; top: calc(var(--top) + 108px); inset-inline: 12px; z-index: 8; background: var(--raised); border-radius: 16px; box-shadow: var(--sh3); border: 1px solid var(--field-b); max-height: 520px; overflow-y: auto; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 8px 16px; border: 0; background: none; text-align: start; cursor: pointer; position: relative; color: var(--t1); }
.row + .row::before { content: ''; position: absolute; top: 0; inset-inline-start: 16px; inset-inline-end: 0; height: 1px; background: var(--bsub); }
.row:active { background: var(--pressed); }
.code { flex: none; font: 500 calc(12px * var(--fs)) / calc(16px * var(--fs)) var(--font); letter-spacing: 1.2px; font-variant-numeric: tabular-nums; color: var(--t2); background: var(--chip); border-radius: 4px; padding: 4px 6px; direction: ltr; }

/* ---------- toast ---------- */
.toast { position: absolute; top: calc(var(--top) + 112px); left: 50%; z-index: 70; transform: translate(-50%, -8px); opacity: 0; pointer-events: none; background: #121C36; color: #F3F6FC; border-radius: 999px; padding: 10px 18px; font-size: calc(15px * var(--fs)); line-height: calc(22px * var(--fs)); width: max-content; max-width: calc(100% - 48px); text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.35); transition: opacity 200ms var(--ease-accel), transform 200ms var(--ease-accel); }
.toast.on { opacity: 1; transform: translate(-50%, 0); transition: opacity 200ms var(--ease-decel), transform 200ms var(--ease-decel); }
:root[data-reduce] .toast { transform: translate(-50%, 0); }
.pill { position: absolute; top: calc(var(--top) + 112px); left: 50%; transform: translateX(-50%); z-index: 5; background: rgba(11,19,38,.78); color: #F3F6FC; padding: 8px 14px; border-radius: 999px; font-size: calc(13px * var(--fs)); white-space: nowrap; }
.pill::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #F2BC62; margin-inline-end: 8px; }

/* ---------- boarding-pass card + coupon ---------- */
.card { position: absolute; inset-inline: 12px; bottom: calc(var(--bottom) + 16px); z-index: 4; filter: drop-shadow(0 12px 14px rgba(0,0,0,.45)); transform: translateY(calc(100% + 80px)); transition: transform 200ms var(--ease-accel); }
.card.open { transform: none; transition: transform 320ms var(--ease-decel); }
:root[data-reduce] .card { transform: none; opacity: 0; pointer-events: none; transition: opacity 200ms linear; }
:root[data-reduce] .card.open { opacity: 1; pointer-events: auto; }
.bp { --stubx: 108px; --cy: 160px; display: flex; flex-direction: column; background: var(--raised); border-radius: 18px; max-height: calc(914px - var(--top) - 160px - var(--bottom) - 16px); overflow: hidden;
  -webkit-mask: radial-gradient(circle 11px at var(--stubx) 0, #0000 98%, #000), radial-gradient(circle 11px at 0 var(--cy), #0000 98%, #000), radial-gradient(circle 11px at 100% var(--cy), #0000 98%, #000);
  -webkit-mask-composite: source-in; mask: radial-gradient(circle 11px at var(--stubx) 0, #0000 98%, #000), radial-gradient(circle 11px at 0 var(--cy), #0000 98%, #000), radial-gradient(circle 11px at 100% var(--cy), #0000 98%, #000); mask-composite: intersect; }
:root[data-theme="dark"] .bp { box-shadow: inset 0 0 0 1px rgba(163,179,219,.16); }
.bp-top { display: flex; position: relative; flex: none; }
.c-main { flex: 1; min-width: 0; padding: 22px 20px 16px; position: relative; }
.c-main .strip { position: absolute; top: 0; inset-inline: 0; height: 4px; background: var(--sel); border-start-start-radius: 18px; }
.c-stub { width: 108px; flex: none; border-inline-start: 2px dashed var(--perf); margin-bottom: 4px; padding: 54px 10px 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.lbl { font-weight: 600; font-size: calc(12px * var(--fs)); line-height: calc(16px * var(--fs)); color: var(--t2); }
.c-name { margin: 4px 0 0; padding-inline-end: 48px; font-weight: 700; font-size: calc(28px * min(var(--fs), 1.6)); line-height: calc(34px * min(var(--fs), 1.6)); outline: none; }
.c-en { padding-inline-end: 48px; font-weight: 500; font-size: calc(14px * var(--fs)); line-height: calc(20px * var(--fs)); letter-spacing: 2px; text-transform: uppercase; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: start; }
.c-fields { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
.clock { font-weight: 700; font-size: calc(22px * var(--fs)); line-height: calc(26px * var(--fs)); font-variant-numeric: tabular-nums; text-align: start; }
.val { font-weight: 500; font-size: calc(15px * var(--fs)); line-height: calc(20px * var(--fs)); }
.sub { font-size: calc(12px * var(--fs)); line-height: calc(16px * var(--fs)); color: var(--t2); }
.card .close { position: absolute; top: 4px; inset-inline-end: calc(108px + 4px); width: 48px; height: 48px; border-radius: 50%; border: 0; background: transparent; color: var(--t1); cursor: pointer; display: grid; place-items: center; }
.flap { display: flex; gap: 3px; direction: ltr; }
.flap span { width: 24px; height: 32px; border-radius: 4px; background: #121C36; color: #F3F6FC; display: grid; place-items: center; font: 600 18px/1 var(--font); }
:root[data-theme="dark"] .flap span { background: #060B18; }
.barcode { margin-top: auto; height: 30px; width: 80px; color: var(--t1); }
.coupon { position: relative; display: flex; flex-direction: column; min-height: 0; padding: 12px 20px 16px; }
.coupon::before { content: ''; position: absolute; top: 0; inset-inline: 14px; border-top: 2px dashed var(--perf); }
.cp-list { overflow-y: auto; min-height: 0; flex: 1 1 auto; margin-inline: -8px; padding-inline: 8px; overscroll-behavior: contain; }
.sec-lbl { font-weight: 500; font-size: calc(12px * var(--fs)); line-height: calc(16px * var(--fs)); color: var(--t3); margin: 8px 0 2px; }
.trow-wrap { border-radius: 12px; position: relative; }
.trow-wrap.open { background: var(--alt); }
/* README 2.1 (Raz): in dark, surfaceAlt equals the card surface, so the open row uses #1A2749 and Edit gets a border.control outline. */
:root[data-theme="dark"] .trow-wrap.open { background: #1A2749; }
:root[data-theme="dark"] .trow-wrap.open .btn.secondary { box-shadow: inset 0 0 0 1px var(--bctl); }
.trow-wrap.flash { animation: flash 1200ms var(--ease-standard); }
@keyframes flash { 0% { background: transparent; } 17% { background: var(--ok-sbg); } 50% { background: var(--ok-sbg); } 100% { background: transparent; } }
:root[data-reduce] .trow-wrap.flash { animation: none; }
.trow { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 56px; padding: 8px 8px; border: 0; background: none; color: var(--t1); text-align: start; cursor: pointer; border-radius: 12px; }
.trow:active { background: var(--pressed); }
.active-bar { position: absolute; inset-inline-start: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--ok-bg); }
.tr-text { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; }
.tr-name { font-weight: 500; font-size: calc(16px * var(--fs)); line-height: calc(24px * var(--fs)); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tr-dates { font-size: calc(13px * var(--fs)); line-height: calc(18px * var(--fs)); color: var(--t2); font-variant-numeric: tabular-nums; }
.chip-active { display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; font-weight: 500; font-size: calc(12px * var(--fs)); line-height: calc(16px * var(--fs)); background: var(--ok-sbg); color: var(--ok-sfg); border-radius: 999px; padding: 2px 8px; }
.chip-active::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--ok-bg); }
.chev { color: var(--t3); transition: transform 200ms var(--ease-standard); }
.open > .trow .chev { transform: rotate(180deg); }
:root[data-reduce] .chev { transition: none; }
.tr-more { padding: 0 8px 12px; }
.tr-notes { font-size: calc(15px * var(--fs)); line-height: calc(22px * var(--fs)); white-space: pre-wrap; margin: 2px 0 8px; }
.tr-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.tr-actions .btn { width: auto; flex: 1 1 120px; }
.cp-line { display: flex; align-items: center; gap: 8px; min-height: 48px; font-size: calc(13px * var(--fs)); line-height: calc(18px * var(--fs)); color: var(--t2); flex-wrap: wrap; }
.skel { border-radius: 6px; background: var(--skel); height: 12px; animation: pulse 1000ms var(--ease-standard) infinite alternate; }
@keyframes pulse { from { opacity: .55; } to { opacity: 1; } }
:root[data-reduce] .skel { animation: none; opacity: .75; }

/* ---------- buttons, notices, fields ---------- */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 48px; border-radius: 999px; border: 0; cursor: pointer; font-weight: 500; font-size: calc(16px * var(--fs)); line-height: calc(24px * var(--fs)); padding: 10px 20px; }
.btn.primary { background: var(--pri-bg); color: var(--pri-fg); } .btn.primary:active { background: var(--pri-pressed); }
.btn.cta { background: var(--cta-bg); color: var(--cta-fg); } .btn.cta:active { background: var(--cta-pressed); }
.btn.secondary { background: var(--sec-bg); color: var(--sec-fg); }
.btn.text { background: none; color: var(--link); }
.btn.plain { background: none; color: var(--t1); }
.btn[aria-busy="true"] { cursor: default; }
.btn.inline { width: auto; display: inline-flex; padding: 10px 12px; }
.spinner { width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid currentColor; border-top-color: transparent; animation: spin 900ms linear infinite; flex: none; }
.spinner.s16 { width: 16px; height: 16px; border-width: 2px; } .spinner.s32 { width: 32px; height: 32px; border-width: 3px; }
@keyframes spin { to { transform: rotate(360deg); } }
:root[data-reduce] .spinner { animation-duration: 2400ms; }
.notice { display: flex; gap: 10px; align-items: flex-start; background: var(--info-bg); color: var(--info-fg); border-radius: 12px; padding: 12px; margin: 0 0 16px; font-size: calc(15px * var(--fs)); line-height: calc(22px * var(--fs)); }
.fine { font-size: calc(13px * var(--fs)); line-height: calc(18px * var(--fs)); color: var(--t2); margin: 8px 0 0; }
.field { margin-top: 20px; }
.field > label, .field > .flabel { display: block; font-weight: 500; font-size: calc(12px * var(--fs)); line-height: calc(16px * var(--fs)); color: var(--t2); margin-bottom: 6px; }
.input { width: 100%; min-height: 56px; border-radius: 8px; border: 1px solid var(--bctl); background: var(--surface); color: var(--t1); padding: 14px 14px; font-size: calc(16px * var(--fs)); line-height: calc(24px * var(--fs)); outline: none; text-align: start; }
.input:focus { border: 2px solid var(--focus); padding: 13px; }
.input.err { border: 2px solid var(--alert); padding: 13px; }
textarea.input { min-height: 96px; max-height: calc(24px * var(--fs) * 8 + 28px); resize: none; display: block; }
.input::placeholder { color: var(--t3); }
.dates { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
.dates .field { margin-top: 0; flex: 1 1 160px; min-width: 160px; }
.datebtn { display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; font-variant-numeric: tabular-nums; }
.datebtn .ph { color: var(--t3); }
.meta { display: flex; justify-content: space-between; gap: 12px; margin-top: 6px; font-size: calc(13px * var(--fs)); line-height: calc(18px * var(--fs)); color: var(--t2); }
.meta .cnt { flex: none; font-variant-numeric: tabular-nums; direction: ltr; }
.ferr { display: flex; gap: 6px; align-items: flex-start; margin-top: 6px; color: var(--alert); font-size: calc(13px * var(--fs)); line-height: calc(18px * var(--fs)); }

/* ---------- sheets ---------- */
.sheet-scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 21; opacity: 0; pointer-events: none; transition: opacity 200ms linear; }
.sheet-scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 22; background: var(--raised); color: var(--t1); border-radius: 28px 28px 0 0; padding: 12px 16px calc(var(--bottom) + 20px); border-top: 1px solid var(--field-b); max-height: calc(100% - var(--top) - 12px); display: flex; flex-direction: column;

};

/* =================== contrast lab (README 7.4) =================== */
function lum(hex) { const v = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255).map(c => c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4); return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2]; }
function ratio(a, b) { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
function mix(top, a, bottom) { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); const T = p(top), B = p(bottom); return '#' + T.map((v, i) => Math.round(v * a + B[i] * (1 - a)).toString(16).padStart(2, '0')).join(''); }
(function lab() {
  const line = '#4FCFBE', halo = '#03060F', ha = 0.7;
  const samples = [['אוקיינוס כהה', '#0A2A52'], ['אוקיינוס בהיר', '#0D3A70'], ['יער', '#284220'], ['מדבר', '#C29C69'], ['קרח', '#DEE5EB'], ['אטמוספרה', '#9FD0FF']];
  const f = r => `<span class="${r >= 3 ? 'ok' : 'bad'}">${r.toFixed(2)}</span>`;
  $('#lab').innerHTML = `<table><tr><th>רקע</th><th>קו לבד</th><th>קו מול הילה</th><th>הילה מול רקע</th></tr>${samples.map(([n, c]) => { const m = mix(halo, ha, c); return `<tr><td><span style="display:inline-block;width:10px;height:10px;background:${c};border:1px solid #999;vertical-align:middle"></span> ${n}</td><td>${f(ratio(line, c))}</td><td>${f(ratio(line, m))}</td><td>${f(ratio(m, c))}</td></tr>`; }).join('')}
    <tr><td>הבחירה #FF7A57</td><td colspan="3">${ratio(line, '#FF7A57').toFixed(2)} · הבדל בגוון, ההבחנה לפי עובי, זוהר וקו לבן (7.3)</td></tr></table>
    <div style="color:#646E8A;margin-top:4px">הילה ${halo} בשקיפות ${ha}. ב-0.55 הקו מול ההילה על קרח: ${ratio(line, mix(halo, 0.55, '#DEE5EB')).toFixed(2)}</div>`;
  const cv2 = $('#labCanvas'), g = cv2.getContext('2d'); const w = cv2.width / samples.length;
  samples.forEach(([n, c], i) => {
    const x0 = i * w; g.fillStyle = c; g.fillRect(x0, 0, w, 250);
    const shape = (y) => { g.beginPath(); g.moveTo(x0 + 14, y + 40); g.bezierCurveTo(x0 + 30, y, x0 + w - 30, y + 10, x0 + w - 14, y + 34); g.bezierCurveTo(x0 + w - 30, y + 70, x0 + 30, y + 72, x0 + 14, y + 40); };
    shape(10); g.strokeStyle = line; g.lineWidth = 2.4; g.stroke();
    shape(90); g.fillStyle = 'rgba(79,207,190,.22)'; g.fill(); g.strokeStyle = 'rgba(3,6,15,.7)'; g.lineWidth = 7.2; g.stroke(); g.strokeStyle = line; g.lineWidth = 2.4; g.stroke();
    shape(170); g.fillStyle = 'rgba(255,122,87,.3)'; g.fill(); g.save(); g.shadowColor = '#FF7A57'; g.shadowBlur = 12; g.strokeStyle = 'rgba(255,122,87,.55)'; g.lineWidth = 16; g.stroke(); g.restore(); g.strokeStyle = 'rgba(3,6,15,.6)'; g.lineWidth = 6.4; g.stroke(); g.strokeStyle = '#F3F6FC'; g.lineWidth = 3.2; g.stroke();
  });
  g.fillStyle = '#fff'; g.font = '600 18px sans-serif'; g.textAlign = 'right';
  g.fillText('בלי הילה', 690, 26); g.fillText('נסיעה (עם הילה)', 690, 106); g.fillText('בחירה', 690, 186);
})();
