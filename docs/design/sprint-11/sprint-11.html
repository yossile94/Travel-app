<style>
  /* Tokens from docs/design/tokens.json 0.11.0 + tokens-0.12.0.proposed.json. No new hex values

  :root { --fs: 1; }
  :root {
    --canvas:#FFFBF5; --surface:#FFFFFF; --raised:#FFFFFF; --tag:#FBF4E8; --pressed:#FBF4E8;

  body.dark .boxed { border:1px solid var(--bSub); }
  /* sheets */
  .scrimL { position:absolute; inset:0; background:var(--scrim); }
  .sheet { position:absolute; inset-inline:0; bottom:0; background:var(--raised); border-radius:28px 28px 0 0; padding:8px 16px 28px; display:flex; flex-direction:column; gap:10px; }
  body.dark .sheet { border-top:1px solid var(--bSub); }
  .handle { width:32px; height:4px; border-radius:2px; background:var(--bCtl); opacity:.6; margin:4px auto; }
  .x { position:absolute; inset-inline-end:8px; top:12px; width:48px; height:48px; display:grid; place-items:center; color:var(--t1); }
  .mrow { display:flex; align-items:center; gap:12px; min-height:56px; }
  .mrow.dis { color:var(--disFg); }
  .pace { border:1px solid var(--bCtl); border-radius:12px; min-height:64px; padding:10px 12px; display:flex; gap:12px; align-items:center; }
  .pace.on { border:2px solid var(--pBg); background:var(--secBg); }
  .rdot { width:20px; height:20px; border-radius:50%; border:2px solid var(--bCtl); display:grid; place-items:center; flex:none; }
  .rdot.on { border-color:var(--pBg); }
  .rdot.on::after { content:''; width:10px; height:10px; border-radius:50%; background:var(--pBg); }
  .toast { position:absolute; inset-inline:16px; padding:12px 16px; border-radius:12px; background:var(--toastBg); color:var(--toastFg); font-size:calc(14px*var(--fs)); line-height:calc(20px*var(--fs)); }
  /* map */
  .mapWrap { position:absolute; inset:0; top:84px; bottom:200px; overflow:hidden; }
  .mapPanel { position:absolute; inset-inline:0; bottom:0; padding:16px 16px 28px; background:var(--raised); border-radius:24px 24px 0 0; display:flex; flex-direction:column; gap:8px; }
  .zoom { position:absolute; inset-inline-start:12px; top:12px; display:flex; flex-direction:column; gap:8px; }

  .mapAttr { position:absolute; bottom:8px; left:8px; right:8px; display:flex; justify-content:space-between; font:600 11px system-ui; color:#4A5573; direction:ltr; }

  /* ===================== admin ===================== */

    --color-bg-canvas:#FFFBF5; --color-bg-surface:#FFFFFF; --color-bg-surface-alt:#FBF4E8; --color-bg-pressed:#FBF4E8; --color-bg-tag:#FBF4E8;

    --color-border-subtle:#F4E7D0; --color-border-control:#7D869E; --color-focus-ring:#1F78DB;
    --color-toast-bg:#121C36; --color-toast-fg:#F3F6FC;
    position:relative; width:1200px; height:860px; border-radius:12px; overflow:hidden; background:var(--color-bg-canvas); color:var(--color-text-primary);
    box-shadow:0 8px 30px rgba(18,28,54,.25); font-size:16px; line-height:24px;
  }

  .radio { min-height:44px; display:inline-flex; align-items:center; gap:8px; }

  <symbol id="up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="down" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="drag" viewBox="0 0 24 24"><path d="M5 9h14M5 15h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>

  <symbol id="info" viewBox="0 0 24 24"><path d="M12 3a9 9 0 100 18 9 9 0 000-18zm0 8v5m0-8.5v.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="alert" viewBox="0 0 24 24"><path d="M12 3a9 9 0 100 18 9 9 0 000-18zM12 7.5v5.5M12 16.5v.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="warn" viewBox="0 0 24 24"><path d="M12 4l9 16H3zM12 10v4.5M12 17.5v.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="minus" viewBox="0 0 24 24"><path d="M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="cal" viewBox="0 0 24 24"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="clock" viewBox="0 0 24 24"><path d="M12 3a9 9 0 100 18 9 9 0 000-18zM12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="pencil" viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16zM14 6l3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="search" viewBox="0 0 24 24"><path d="M10.5 4a6.5 6.5 0 104.6 11.1L20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="cloudOff" viewBox="0 0 24 24"><path d="M3 3l18 18M8 8a5 5 0 00-1 9.9h10M17.7 13.2A4 4 0 0014 8.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="bed" viewBox="0 0 24 24"><path d="M3 18V7M3 14h18v4M21 14v-3a3 3 0 00-3-3h-7v6M7 11h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>

<h2 class="part">חלק א · הטלפון</h2>
<div class="row" id="phones"></div>
<h2 class="part">חלק ב · פאנל האדמין (מחשב)</h2>
<div class="row" id="desks"></div>

<script>
let lang = 'he';
const T = (he, en) => lang === 'he' ? he : en;
const icon = (id, cls='ic16', extra='') => `<svg class="${cls} ${extra}" aria-hidden="true"><use href="#${id}"/></svg>`;
const iso = (s) => `<span class="iso num">${s}</span>`;
const own = (s) => `<span class="own" lang="en">${s}</span>`;
const phone = (inner, cap) => `<div class="frame"><p class="cap">${cap}</p><div class="phone">${inner}</div></div>`;
const desk = (inner, cap) => `<div class="dframe"><p class="cap">${cap}</p><div class="desk">${inner}</div></div>`;
const km = (n) => T(`${iso(n)} ק"מ`, `${n} km`);
const m = (n) => T(`${iso(n)} מ'`, `${n} m`);

/* ---------- shared bits ---------- */
const bar = (title, sub, closeIcon=false, extra='') => `<div class="bar"><span class="backBtn">${closeIcon?icon('close','ic24'):icon('back','ic24','flipRtl')}</span>
  <div class="grow"><p class="barT" role="heading">${title}</p>${sub?`<p class="foot t2">${sub}</p>`:''}</div>${extra}</div>`;
const notice = (text, ic='info', extra='') => `<div class="notice">${icon(ic,'ic20')}<div class="grow vstack" style="gap:4px"><p class="callout">${text}</p>${extra}</div></div>`;
const field = (label, value, {err=null, ltr=false, ic=null, ph=false, multi=false, counter=null, help=null}={}) => `<div><p class="flabel">${label}</p>
  <div class="field${err?' err':''}${multi?' multi':''}"><span class="${ltr?'iso num':''} ${ph?'t3':''}">${value}</span>${ic?icon(ic,'ic20'):''}</div>
  ${err?`<p class="foot ferr">${icon('alert')}${err}</p>`:''}${help||counter?`<div class="between"><p class="foot t2">${help||''}</p>${counter?`<p class="foot t2 num">${iso(counter)}</p>`:''}</div>`:''}</div>`;
const toast = (text, bottom=28) => `<div class="toast" style="bottom:${bottom}px">${text}</div>`;
const tripName = () => T('תאילנד בדצמבר', 'Thailand in December');
const country = () => T('תאילנד', 'Thailand');
const cat = {
  attractions:()=>T('אטרקציות','Attractions'), nature:()=>T('טבע','Nature'), culture:()=>T('תרבות והיסטוריה','Culture & history'),
  families:()=>T('משפחות','Families'), food:()=>T('אוכל ושווקים','Food & markets'), shopping:()=>T('קניות','Shopping'),
  chabad:()=>T('חב"ד','Chabad'), kosher:()=>T('כשרות','Kosher'), memorial:()=>T('אתר זיכרון','Memorial site'),
};
const curatedTag = () => `<span class="chip c-info">${T('מומלץ לישראלים','Curated for Israelis')}</span>`;
const autoTag = () => `<span class="chip c-tag">${icon('wand','ic12')}${T('אוטומטי','Auto')}</span>`;

/* Update 29.10: three fixed tabs under the city picker ("In the city" / "Near the hotel" / "Saved"). */
function tabs(active, {hotel=true, saved=12}={}){
  const t = (k, label) => `<span class="tab${k===active?' on':''}" role="tab" style="flex:1;justify-content:center">${label}</span>`;
  return `<div class="tabs" role="tablist">${t('city',T('בעיר','In the city'))}${hotel?t('hotel',T('ליד המלון','Near the hotel')):''}${t('saved',`${T('שמורים','Saved')} ${iso(saved)}`)}</div>`;
}
/* Update 29.10: CityPicker. Trip cities in order (or the 5 largest without a trip), an extra city from search,
   "Other city", and "Whole country" always last. */
const CITY = {
  bkk:()=>T('בנגקוק','Bangkok'), cnx:()=>T("צ'אנג מאי",'Chiang Mai'), kos:()=>T('קוסמוי','Koh Samui'),
  hkt:()=>T('פוקט','Phuket'), pty:()=>T('פטאיה','Pattaya'), hdy:()=>T('האט יאי','Hat Yai'),
  nma:()=>T('נקון ראצ\'סימה','Nakhon Ratchasima'), pai:()=>T('פאי','Pai'), kbi:()=>T('קרבי','Krabi'),
};
function cityPicker(active, list, {extra=null, label=true}={}){
  const c = (k, lbl, opt={}) => `<span class="pchip${k===active?' on':''}" role="${opt.btn?'button':'radio'}">${k===active?icon('check'):''}${opt.ic?icon(opt.ic):''}${lbl}${opt.manual?` <span class="t3" style="font-size:.85em">· ${T('בהקלדה','typed')}</span>`:''}</span>`;
  return `<div style="padding-top:4px">${label?`<p class="flabel" style="padding:0 16px">${T('עיר','City')} <span class="newMark">29.10</span></p>`:''}
    <div class="hscroll" role="radiogroup" style="padding-bottom:8px">${list.map(([k,opt])=>c(k, CITY[k](), opt||{})).join('')}${extra?c(extra, CITY[extra]()):''}${c('other', T('עיר אחרת','Other city'), {btn:true, ic:'search'})}${c('all', T('בכל המדינה','Whole country'))}</div></div>`;
}
const tripCities = [['bkk'],['cnx'],['kos',{manual:true}]];
const largest = [['bkk'],['nma'],['hdy'],['hkt'],['pty']];
const scope = (text) => `<p class="foot t2" style="padding:0 16px">${text}</p>`;
function chips(active){
  const list = [['all',T('הכול','All')],['attractions',cat.attractions()],['nature',cat.nature()],['culture',cat.culture()],['families',cat.families()],['food',cat.food()],['shopping',cat.shopping()]];
  return `<div class="hscroll" style="padding-top:12px">${list.map(([k,l])=>`<span class="pchip${k===active?' on':''}" role="radio">${k===active?icon('check'):''}${l}</span>`).join('')}</div>`;
}
function placeRow({he, en, c, dist=null, curated=false, saved=false, actions='save'}){
  const primary = lang==='he' && he ? he : own(en);
  const secondary = lang==='he' && he ? own(en) : (he && lang!=='he' ? he : '');
  const acts = actions==='save'
    ? `<span class="iconBtn${saved?' on':''}">${icon(saved?'bmOn':'bm','ic24')}</span><span class="iconBtn">${icon('nav','ic24')}</span>`
    : `<span class="iconBtn">${icon('nav','ic24')}</span><span class="iconBtn">${icon('more','ic24')}</span>`;
  return `<div class="prow" role="button"><div class="grow vstack" style="gap:2px;padding-top:2px">
      <p class="bodyS">${primary}</p>${secondary?`<p class="foot t2">${secondary}</p>`:''}
      <div class="wrap" style="gap:6px;align-items:center;margin-top:2px">${curated?curatedTag():''}<p class="foot t2">${c}${dist?` · ${dist}`:''}</p></div></div>
    <div class="hstack" style="gap:4px;flex-wrap:${'wrap'};justify-content:flex-end">${acts}</div></div>`;
}
const dayH = (n, wd, date, label=null, {today=false, transit=false, city=null, sticky=false}={}) => `<div class="dayH${sticky?' sticky':''}" role="heading">
  <div><p class="bodyS ${transit?'t2':''}">${T('יום','Day')} ${n} · ${wd} ${iso(date)}</p>${city?`<p class="foot t2">${city}</p>`:''}</div>
  <div class="hstack" style="gap:6px">${today?`<span class="chip c-ok">${T('היום','Today')}</span>`:''}${label?`<span class="chip c-tag">${transit?icon('plane','ic12'):''}${label}</span>`:''}</div></div>`;
const arow = (time, title, {place=null, note=null, auto=false, flash=false, drag=false, lifted=false, sub=null}={}) => `<div class="arow${flash?' flash':''}${lifted?' lifted':''}" role="button">
  <div class="tcol">${time?`<p class="numMd iso">${time}</p>`:`<p class="numMd t3" aria-hidden="true">—</p>`}</div>
  <div class="grow vstack" style="gap:2px;padding-top:1px"><div class="wrap" style="gap:6px;align-items:center"><p class="bodyS">${title}</p>${auto?autoTag():''}</div>
    ${sub?`<p class="foot t2">${sub}</p>`:''}${place||note?`<p class="foot t2" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${place?`${icon('pin','ic12')} ${place}`:''}${place&&note?' · ':''}${note||''}</p>`:''}</div>
  ${drag?`<span class="iconBtn">${icon('drag','ic24')}</span>`:''}<span class="iconBtn">${icon('more','ic24')}</span></div>`;
const addAct = () => `<div style="padding:0 16px;background:var(--surface);border-bottom:1px solid var(--bSub)"><span class="btn b-link">${icon('plus')}${T('הוספת פעילות','Add an activity')}</span></div>`;
const emptyDay = (text) => `<div style="padding:10px 16px 0;background:var(--surface)"><p class="callout t2">${text}</p></div>`;
const wd = (he,en) => T(he,en);

function streetMap(){
  return `<svg viewBox="0 0 411 576" style="position:absolute;inset:0;width:100%;height:100%" aria-hidden="true">
    <rect width="411" height="576" fill="#FBF4E8"/>
    <path d="M0 410 C 90 380, 140 470, 230 440 S 380 380, 411 400 L411 576 L0 576z" fill="#D6E9FF"/>
    <rect x="250" y="70" width="120" height="90" rx="10" fill="#E8FAF7"/>
    ${[60,140,230,320].map(x=>`<path d="M${x} 0 L${x+20} 576" stroke="#FFFFFF" stroke-width="10"/>`).join('')}
    ${[80,190,300].map(y=>`<path d="M0 ${y} L411 ${y+30}" stroke="#FFFFFF" stroke-width="12"/>`).join('')}
    <path d="M0 250 C 120 230, 250 280, 411 240" stroke="#F3F6FC" stroke-width="18" fill="none"/>
    <path d="M0 250 C 120 230, 250 280, 411 240" stroke="#FFFBF5" stroke-width="12" fill="none"/>
    ${[[90,110],[170,150],[110,330],[280,210],[200,350],[330,320]].map(([x,y])=>`<rect x="${x}" y="${y}" width="36" height="26" rx="3" fill="#F4E7D0"/>`).join('')}
    <text x="262" y="120" font-size="11" fill="#4A5573" font-family="system-ui">Lumphini Park</text>
    <text x="40" y="500" font-size="11" fill="#4A5573" font-family="system-ui">Chao Phraya</text>
  </svg>`;
}

function phones(){
  const out = [];

  // 1a. country card with "What to see"
  out.push(phone(`<div class="card"><div class="strip"></div><p class="capt t2">${T('יעד','Destination')}</p>
      <p class="title2" style="font-size:calc(28px*var(--fs));line-height:1.2">${country()}</p><p class="callout t2 iso">Thailand</p>
      <div style="height:1px;border-top:2px dashed var(--bSub);margin:4px -16px"></div>
      <div class="hstack" style="gap:8px;align-items:stretch">
        ${[['clock',iso('21:40'),T('שעה','Time')],['info','THB',T('מטבע','Money')],['info',iso('27°'),T('טמפרטורה','Temp.')],['warn','',T('בטיחות','Safety')],['pin','',T('מה לראות','What to see')]].map(([ic,v,l],i)=>`<div style="flex:1;min-width:0;min-height:76px;border-radius:12px;background:var(--tag);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 2px;${i===4?'outline:2px solid var(--pBg);outline-offset:1px':''}">${icon(ic,'ic24')}${v?`<p class="foot num" style="font-weight:500">${v}</p>`:''}<p class="capt t2" style="text-align:center">${l}</p></div>`).join('')}</div>
      <span class="newMark">29.10: CardTile "What to see" (fix/country-card), not a CardPlacesLink row</span>
      <p class="foot link" style="text-decoration:underline;align-self:flex-end">${T('מקורות','Sources')}</p></div>`,
    T('1א · עדכון 29.10: כרטיס המדינה אחרי התיקון הדחוף (fix/country-card). "מה לראות" הוא אייקון ברצועה, לא שורה. האייקונים כאן סכמטיים, והסדר ברצועה (כולל "בטיחות") נקבע באישור של רז לתיקון. ההקשה פותחת את PlacesScreen עם בורר הערים.',
      '1a · Update 29.10: the country card after the urgent fix (fix/country-card). What to see is a tile in the strip, not a row. Icons here are schematic; the strip order (incl. Safety) is set in Raz\'s review of the fix. Tapping opens PlacesScreen with the city picker.')));

  // 1b. trip kit sections
  out.push(phone(`<div class="card" style="gap:8px"><div class="strip"></div><p class="capt t2">${T('נסיעות','Trips')}</p>
      <div class="openRow" style="gap:8px"><div class="between"><p class="bodyS">${tripName()}</p><p class="foot t2">${iso('20.12 – 27.12')}</p></div>
      <p class="capt t2">${T('טיסות','Flights')}</p><div class="brow"><p class="callout">${iso('TLV → BKK · LY 081')}</p></div>
      <p class="capt t2">${T('מלונות','Hotels')}</p><div class="brow"><span class="hstack">${icon('bed','ic20','t2')}<p class="callout">${own('Amari Watergate')}</p></span></div>
      <p class="capt t2" role="heading">${T('מסלול','Itinerary')} <span class="newMark">new</span></p>
      <div class="boxed"><p class="foot t2">${T('היום · יום 3 · ג׳','Today · Day 3 · Tue')} ${iso('22.12')}</p>
        <div class="hstack"><p class="callout num iso" style="width:44px">09:30</p><p class="callout grow">${T('הארמון הגדול','Grand Palace')}</p>${autoTag()}</div>
        <div class="hstack"><p class="callout num iso" style="width:44px">15:30</p><p class="callout grow">${own('Wat Pho')}</p>${autoTag()}</div>
        <div class="hstack"><p class="callout num iso" style="width:44px">19:00</p><p class="callout grow">${T('אוכל ב-','Food in ')}${own('Chinatown')}</p></div>
        <div class="between" style="flex-wrap:wrap"><span class="btn b-secondary" style="min-height:44px">${T('פתיחת המסלול','Open the itinerary')}${icon('chev','ic16','flipRtl')}</span><p class="foot t2">${T('8 ימים · 5 מתוכננים','8 days · 5 planned')}</p></div></div>
      <p class="capt t2" role="heading">${T('מה לראות','What to see')} <span class="newMark">new</span></p>
      <div class="boxed" style="padding:0;gap:0"><div class="lrow"><span class="t2">${icon('pin','ic24')}</span><div class="grow"><p class="body">${T('מה לראות בתאילנד','What to see in Thailand')}</p><p class="foot t2">${T('לפי עיר, ליד המלון, ולפי קטגוריה','By city, near the hotel and by category')}</p></div><span class="t2">${icon('chev','ic20','flipRtl')}</span></div>
        <div class="lrow" style="border-top:1px solid var(--bSub)"><span class="t2">${icon('bm','ic24')}</span><p class="body grow">${T('שמורים לנסיעה','Saved for this trip')}</p><p class="bodyS num">${iso(12)}</p><span class="t2">${icon('chev','ic20','flipRtl')}</span></div></div>
      <p class="capt t2">${T('ביטוח','Insurance')} · ${T('חירום בתאילנד','Emergency in Thailand')} …</p></div></div>`,
    T('1ב · תיק הנסיעה: "מסלול" ו"מה לראות" אחרי "מלונות" ולפני "ביטוח". המקטע לא לחיץ, רק "פתיחת המסלול". עד 3 פעילויות של היום.',
      '1b · Trip kit: Itinerary and What to see after Hotels, before Insurance. Only the button opens the board; up to 3 of today\'s activities.')));

  // 2. Places, trip mode: city picker + "In the city" (update 29.10)
  out.push(phone(`${bar(T('מה לראות בתאילנד','What to see in Thailand'), tripName())}${cityPicker('bkk', tripCities)}${tabs('city')}${chips('all')}
      <div class="content" style="padding-top:8px">${`<p class="foot t2">${T('עד 15 ק"מ ממרכז בנגקוק','Within 15 km of the centre of Bangkok')}</p>`}<div class="list">
        ${placeRow({he:'בית חב"ד בנגקוק', en:'Chabad House Bangkok', c:cat.chabad(), curated:true, saved:true, dist:km('2.1')})}
        ${placeRow({he:'הארמון הגדול', en:'Grand Palace', c:cat.attractions(), saved:true, dist:km('1.2')})}
        ${placeRow({he:'וואט פו', en:'Wat Pho', c:cat.culture(), dist:km('1.5')})}
        ${placeRow({he:'', en:'Lumphini Park', c:cat.nature(), dist:m(850)})}
      </div><p class="foot t2">${T('מוצגים 20 מתוך 20','Showing 20 of 20')}</p></div>`,
    T('2 · עדכון 29.10, מצב נסיעה: בורר הערים בראש (ערי הנסיעה לפי הסדר, "עיר אחרת", ו"בכל המדינה" תמיד אחרון). ברירת המחדל בנסיעה פעילה: העיר של הלילה. מתחתיו שלוש לשוניות קבועות. "קוסמוי" הוקלדה ידנית ומופיעה בבורר (מצב ריק, מסך 3ב). אוצרים ראשונים, ואז פופולריות. מרחק ממרכז העיר.',
      '2 · Update 29.10, trip mode: the city picker on top (trip cities in order, Other city, and Whole country always last). Default on an active trip: tonight\'s city. Three fixed tabs below. Koh Samui was typed and appears in the picker (empty state, screen 3b). Curated first, then popularity. Distance from the centre.')));

  // 3. Country card without a trip: 5 largest, no tab bar (update 29.10)
  out.push(phone(`${bar(T('מה לראות בתאילנד','What to see in Thailand'), null)}${cityPicker('bkk', largest)}${chips('shopping')}
      <div class="content" style="padding-top:16px;align-items:flex-start">
        <p class="body">${T('אין מקומות בקטגוריה הזו עד 15 ק"מ ממרכז בנגקוק.','No places in this category within 15 km of the centre of Bangkok.')}</p>

      '19 · Update 29.10: in the trip form, CitiesSection moves right after the destination, titled "Which city will you be in?". The component, the cap of 10 and "As written" are unchanged. Order: destination, cities, dates, name, flights, travellers, notes.')));

  // 20. The short question before save_trip (create / duplicate without a listed city)
  out.push(phone(`${bar(T('נסיעה חדשה','New trip'), null, true)}<div class="content">${destBlock}
      <div><p class="bodyS">${T('באיזו עיר תהיו?','Which city will you be in?')}</p><span class="btn b-link">${icon('plus')}${T('הוספת עיר','Add a city')}</span></div></div>
      <div class="footer"><span class="btn b-primary">${T('שמירת הנסיעה','Save trip')}</span></div>
      <div class="scrimL"></div>
      <div class="sheet"><div class="handle"></div><span class="x">${icon('close','ic20')}</span>
        <p class="title2" role="heading" style="padding-inline-end:44px">${T('באיזו עיר תהיו?','Which city will you be in?')}</p>
        <p class="callout t2">${T('כך נציע מה לראות לפי העיר. אפשר לשנות אחר כך בעריכת הנסיעה.','That way we can suggest what to see by city. You can change it later by editing the trip.')}</p>
        <div class="list" style="background:transparent">${largest.map(([k],i)=>`<div class="mrow" role="button" style="${i?'border-top:1px solid var(--bSub)':''}"><span class="t2">${icon('pin','ic20')}</span><p class="body grow">${CITY[k]()}</p></div>`).join('')}
          <div class="mrow" role="button" style="border-top:1px solid var(--bSub)"><span class="t2">${icon('search','ic20')}</span><p class="body grow link">${T('חיפוש עיר אחרת','Search for another city')}</p>${icon('chev','ic20','flipRtl t2')}</div></div>
        <span class="btn b-text" style="align-self:center">${T('דילוג ושמירה בלי עיר','Skip and save without a city')}</span>
      </div>`,
    T('20 · עדכון 29.10: ביצירה ובשכפול, "שמירת הנסיעה" בלי אף עיר מהרשימה פותח את השאלה לפני save_trip: 5 הערים הגדולות, חיפוש, ודילוג. הקשה על עיר שומרת מיד (קריאה אחת). × חוזר לטופס בלי לשמור. פעם אחת לכל נסיעה (סימון במכשיר). בעריכה אין שאלה.',
      '20 · Update 29.10: on create and duplicate, Save with no listed city opens this question before save_trip: the 5 largest cities, search, and skip. Tapping a city saves straight away (one call). × goes back to the form without saving. Once per trip (a device flag). Never on edit.')));

  document.getElementById('phones').innerHTML = out.join('');
}

/* ---------- admin ---------- */
function shell(active, inner){
  const items = [['entry',T('כניסה לישראלים','Entry for Israelis')],['mct',T('זמני חיבור','Connection times')],['places',T('מומלץ לישראלים','Curated for Israelis')]];
  const it = ([k,l]) => `<a href="#" ${k===active?'aria-current="page"':''}>${l}${k==='places'?' <span class="newMark">new</span>':''}</a>`;
  return `<div class="dtop"><span class="brand">${T('פאנל התוכן','Content panel')}</span><span class="env">${T('סביבת פיתוח','Development')}</span><span class="spacer"></span>
      <span class="mono" style="font-size:14px;color:var(--color-text-secondary)">dana@example.com</span><span class="rtag">${T('עריכת תוכן','Content editor')}</span>
      <a class="dlink">${T('English','עברית')}</a><a class="dlink">${T('התנתקות','Sign out')}</a></div>
    <div class="dbody"><nav class="dnav" aria-label="main">${items.map(it).join('')}<hr><a href="#">${T('יומן שינויים','Change log')}</a></nav>
    <main class="dmain">${inner}</main></div>`;
}
const dfield = (label, value, {err=null, help=null, ltr=false, multi=false, warn=null, counter=null}={}) => `<div><label class="dlabel">${label}</label>
  <div class="dinput${err?' err':''}${multi?' multi':''}"><span class="${ltr?'mono':''}" style="flex:1">${value}</span>${counter?`<span class="mono" style="font-size:13px;color:var(--color-text-secondary)">${counter}</span>`:''}</div>
  ${err?`<p class="derr">${icon('alert')}${err}</p>`:''}${warn?`<p class="dwarn">${icon('warn')}${warn}</p>`:''}${help?`<p class="dhelp">${help}</p>`:''}</div>`;
const st = (s) => `<span class="stag s-${s}">${{draft:T('טיוטה','Draft'),published:T('מפורסם','Published'),hidden:T('מוסתר','Hidden')}[s]}</span>`;

function desks(){
  const out = [];
  const prow = (he, en, c, k, s, ver, upd, hover=false) => `<tr class="${hover?'hover':''}"><td><a href="#">${lang==='he'?he:en}</a><br><span style="font-size:13px;color:var(--color-text-secondary)" lang="${lang==='he'?'en':'he'}">${lang==='he'?en:he}</span></td><td>${c}</td><td>${k}</td><td>${st(s)}</td><td class="num">${ver}</td><td class="num">${upd}</td></tr>`;

  // A. list
  out.push(desk(shell('places', `<div class="between"><div><h1>${T('מומלץ לישראלים','Curated for Israelis')}</h1><p class="sub">${T('שינויים מגיעים לאפליקציה בהפעלה הבאה שלה.','Changes reach the app the next time it starts.')}</p></div>
        <span class="dbtn primary">${icon('plus')}${T('הוספת מקום','Add a place')}</span></div>
      <div class="hstack" style="gap:12px"><div class="dinput" style="width:320px">${icon('search','ic20')}<span style="color:var(--color-text-tertiary)">${T('חיפוש לפי שם','Search by name')}</span></div>
        <div class="dinput" style="width:200px"><span>${T('מדינה: הכול','Country: all')} ▾</span></div><div class="dinput" style="width:180px"><span>${T('מצב: הכול','Status: all')} ▾</span></div></div>
      <table class="dt"><caption style="position:absolute;clip:rect(0 0 0 0)">${T('מומלץ לישראלים','Curated for Israelis')}</caption>
        <thead><tr><th scope="col">${T('שם','Name')}</th><th scope="col">${T('מדינה','Country')}</th><th scope="col">${T('קטגוריה','Category')}</th><th scope="col">${T('מצב','Status')}</th><th scope="col">${T('אומת ב-','Verified')}</th><th scope="col">${T('עודכן','Updated')}</th></tr></thead>
        <tbody>${prow('בית חב"ד קטמנדו','Chabad House Kathmandu',T('נפאל','Nepal'),cat.chabad(),'published','2.10.2026','2.10.2026')}
          ${prow('אנדרטה לזכר הקהילה','Community memorial',T('פולין','Poland'),cat.memorial(),'hidden','1.9.2026','3.10.2026')}
          ${prow('בית חב"ד בנגקוק','Chabad House Bangkok',T('תאילנד','Thailand'),cat.chabad(),'published','12.10.2026','12.10.2026', true)}
          ${prow('מסעדה כשרה ב-Khao San','Kosher restaurant, Khao San',T('תאילנד','Thailand'),cat.kosher(),'draft','—','27.10.2026')}
          ${prow('בית חב"ד קוסמוי','Chabad House Koh Samui',T('תאילנד','Thailand'),cat.chabad(),'published','12.10.2026','12.10.2026')}</tbody></table>
      <div class="pager"><span class="num">${T('1–50 מתוך 63','1–50 of 63')}</span><span class="hstack"><a class="dlink">‹ ${T('הקודם','Previous')}</a><a class="dlink">${T('הבא','Next')} ›</a></span></div>`),
    T('א · /places: עמודים של 50, לפי מדינה ואז שם. חיפוש וסינון בשרת. תג מצב תמיד עם מילה: טיוטה (tag), מפורסם (success), מוסתר (info, לא disabled: 4.37 נכשל).',
      'A · /places: pages of 50, by country then name. Search and filters on the server. Status always as a word: Draft (tag), Published (success), Hidden (info, not disabled: 4.37 fails).')));

  // B. form
  out.push(desk(shell('places', `<a class="dlink" style="align-self:flex-start;padding:0">‹ ${T('מומלץ לישראלים','Curated for Israelis')}</a>
      <div><h1>${T('מקום חדש','New place')}</h1><p class="sub">${T('שינויים מגיעים לאפליקציה בהפעלה הבאה שלה.','Changes reach the app the next time it starts.')}</p></div>
      <div class="summary" role="alert"><b>${T('יש 2 שגיאות בטופס','There are 2 errors in the form')}</b> · <a class="dlink" style="min-height:0">${T('קואורדינטות','Coordinates')}</a> · <a class="dlink" style="min-height:0">${T('מקור','Source')}</a></div>
      <div class="g2">${dfield(T('מדינה','Country'), `${T('תאילנד','Thailand')} ▾`)}${dfield(T('קטגוריה','Category'), `${cat.chabad()} ▾`)}</div>
      <div class="g2">${dfield(T('שם בעברית','Hebrew name'), 'בית חב"ד בנגקוק')}${dfield(T('שם באנגלית','English name'), 'Chabad House Bangkok', {ltr:true})}</div>
      ${dfield(T('תיאור קצר (לא חובה)','Short description (optional)'), T('בית חב"ד במרכז העיר, עם ארוחות שבת בהרשמה מראש.','A Chabad House in the city centre, with Shabbat meals by advance booking.'), {multi:true, counter:'52/280'})}
      <fieldset class="dfs"><legend>${T('מיקום','Location')}</legend><div class="hstack" style="align-items:flex-start;gap:16px">
        <div style="flex:1">${dfield(T('קואורדינטות (קו רוחב, קו אורך)','Coordinates (latitude, longitude)'), '100.4970, 13.7590', {ltr:true, err:T('קו רוחב בין ‎-90 ל-90.','Latitude between -90 and 90.'), help:T('אפשר להדביק מ-Google Maps: לחיצה ימנית על הנקודה ואז העתקה.','You can paste from Google Maps: right-click the point, then copy.')})}
          <p class="dhelp" style="margin-top:8px">${T('לפני התיקון, האזהרה הרכה [הצעה]:','Before the fix, the soft warning [proposal]:')}</p>
          <p class="dwarn">${icon('warn')}${T('הנקודה נראית מחוץ לתאילנד. בדקו שלא הוחלפו קו הרוחב וקו האורך.','The point looks outside Thailand. Check that latitude and longitude weren\'t swapped.')}</p>
          <p class="dhelp" style="margin-top:8px">${T('אחרי התיקון (13.7590, 100.4970):','After the fix (13.7590, 100.4970):')} <b style="color:var(--color-text-primary)">${T('שייך לעיר: בנגקוק (1.4 ק"מ מהמרכז)','Belongs to: Bangkok (1.4 km from the centre)')}</b></p></div>
        <div style="width:300px;height:170px;border-radius:12px;overflow:hidden;position:relative;border:1px solid var(--color-border-subtle)">${streetMap()}
          <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-100%)"><svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s-7-6.2-7-12a7 7 0 0114 0c0 5.8-7 12-7 12z" fill="#C8441F" stroke="#FFFFFF" stroke-width="1.6"/></svg></div>
          <span class="newMark" style="position:absolute;top:6px;inset-inline-start:8px;background:#fff;padding:0 4px">[proposal] read-only map</span></div></div></fieldset>
      <div class="g2">${dfield(T('מקור','Source'), 'http://chabad.example.org', {ltr:true, err:T('כתובת המקור צריכה להתחיל ב-https://','The source must start with https://')})}${dfield(T('תאריך אימות','Verified on'), '12.10.2026', {ltr:true})}</div>
      <fieldset class="dfs"><legend>${T('מצב','Status')}</legend><div class="radios">
        <span class="radio"><span class="rdot on" style="border-color:#1561BC"></span>${T('טיוטה','Draft')}</span><span class="radio"><span class="rdot" style="border-color:#7D869E"></span>${T('מפורסם','Published')}</span><span class="radio"><span class="rdot" style="border-color:#7D869E"></span>${T('מוסתר','Hidden')}</span></div>
        <p class="dhelp">${T('רק "מפורסם" מופיע באפליקציה.','Only Published appears in the app.')}</p></fieldset>
      <div class="hstack"><span class="dbtn primary">${T('שמירה','Save')}</span><a class="dlink">${T('ביטול','Cancel')}</a></div>`),
    T('ב · /places/new: אותם כללים בכל מצב (D15). קואורדינטות בשדה אחד שמקבל הדבקה [הצעה]. "שייך לעיר" מחושב (D8, אין שדה עיר). אזהרת bbox רכה ומפת בדיקה לקריאה בלבד [הצעות].',
      'B · /places/new: the same rules in every status (D15). One coordinates field that takes a paste [proposal]. "Belongs to" is computed (D8, no city field). Soft bbox warning and a read-only check map [proposals].')));

  // C. audit row
  out.push(desk(shell('', `<h1>${T('יומן שינויים','Change log')}</h1>
      <table class="dt"><thead><tr><th scope="col">${T('מתי','When')}</th><th scope="col">${T('מי','Who')}</th><th scope="col">${T('טבלה · שורה','Table · row')}</th><th scope="col">${T('פעולה','Action')}</th><th scope="col">${T('שינוי','Change')}</th></tr></thead>
        <tbody><tr><td class="num mono">28.10.2026 14:02</td><td class="mono">dana@example.com</td><td>${T('מומלץ לישראלים','Curated for Israelis')} · בית חב"ד בנגקוק</td><td>${T('עדכון','Update')}</td><td>▾ ${T('2 שדות','2 fields')}</td></tr>
          <tr class="diff"><td colspan="5"><span class="mono">status</span>: draft → published</td></tr>
          <tr class="diff"><td colspan="5"><span class="mono">verified_at</span>: 2026-09-01 → 2026-10-12</td></tr>
          <tr><td class="num mono">27.10.2026 18:40</td><td class="mono">dana@example.com</td><td>${T('מומלץ לישראלים','Curated for Israelis')} · מסעדה כשרה ב-Khao San</td><td>${T('הוספה','Insert')}</td><td>▸ ${T('9 שדות','9 fields')}</td></tr></tbody></table>
      <div class="dtoast" role="status">${T('נשמר. האפליקציה תציג את השינוי בהפעלה הבאה שלה.','Saved. The app will show the change the next time it starts.')}</div>`),
    T('ג · היומן (ספרינט 10, Admin בלבד): "מומלץ לישראלים" כשם טבלה, והשם בעברית כמפתח השורה. הטריגר כותב, הטופס לא.',
      'C · Change log (sprint 10, Admin only): "Curated for Israelis" as the table name and the Hebrew name as the row key. The trigger writes it, not the form.')));

  document.getElementById('desks').innerHTML = out.join('');
}

function apply(){
  lang = document.getElementById('lang').value;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';
  document.body.classList.toggle('dark', document.getElementById('dark').checked);
  document.documentElement.style.setProperty('--fs', document.getElementById('fs').value);
  phones(); desks();
}
['dark','fs','lang'].forEach(id => document.getElementById(id).addEventListener('change', apply));
apply();
</script>
</body>
</html>
