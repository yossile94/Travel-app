plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.travelapp'
version = '0.11.0'

android {
  namespace "com.travelapp.passportvault"
}

dependencies {
  // The same BiometricPrompt as expo-secure-store, so one version is resolved.
  implementation "androidx.biometric:biometric:1.1.0"
  implementation "androidx.exifinterface:exifinterface:1.3.7"
  // D7: the bundled Latin model, in the APK; no download through Play Services.
  implementation "com.google.mlkit:text-recognition:16.0.1"
}
