appId: com.travelapp.companion
name: Territories keep their own clock; no data means no field (AC-4)
tags: [sprint-0, ac-4]
---
- launchApp:
    clearState: true

# Christmas Island shares Australia's code but not its clock.
- openLink: travelapp://?lng=105.6726&lat=-10.4908&zoom=5
- waitForAnimationToEnd
- tapOn:
    point: 50%,50%
- extendedWaitUntil:
    visible: 'שעה מקומית · אי חג המולד'
    timeout: 4000
- back

# Antarctica: no local time or currency.
- openLink: travelapp://?lng=35.8855&lat=-79.8432&zoom=2
- waitForAnimationToEnd
- tapOn:
    point: 50%,50%
- extendedWaitUntil:
    visible: אנטארקטיקה
    timeout: 4000
- assertNotVisible:
    id: card-time
- assertNotVisible:
    id: card-currency
