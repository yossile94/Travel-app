appId: com.travelapp.companion
name: Thailand opens a card with its tiles; time, difference, currency and safety one tap away (AC-4; fix AC-3, AC-5)
tags: [sprint-0, ac-4, fix-country-card]
---
- launchApp:
    clearState: true
- openLink: travelapp://?lng=101.0732&lat=15.4597&zoom=4
- waitForAnimationToEnd
- tapOn:
    point: 50%,50%
- extendedWaitUntil:
    visible:
      id: country-card
    timeout: 4000
- assertVisible: תאילנד
- assertVisible: Thailand
- assertVisible:
    id: card-tile-safety
# The clock is checked on the device because Hermes, not Node, formats it.
- assertVisible:
    id: card-tile-time
- assertVisible: '.*\d\d:\d\d.*'
- tapOn:
    id: card-tile-time
- assertVisible:
    id: time-sheet-difference
- assertVisible: '.*יותר מבישראל'
- back
# The currency sheet: the name, the code and the calculator.
- assertVisible: '.*THB.*'
- tapOn:
    id: card-tile-money
- assertVisible:
    id: calculator-sheet
- assertVisible: '.*בהט תאילנדי.*'
# What moved from the card into the sheet: the rate, its date and its source (fix 13.4).
- assertVisible:
    id: money-sheet-rate
- assertVisible: 'עודכן ב-.*'
- assertVisible:
    id: rate-attribution
- back
# The threat level only in the Safety sheet (Yossi, 29.10), with its check date.
- tapOn:
    id: card-tile-safety
- assertVisible:
    id: travel-info-sheet
- assertVisible: 'אזהרת מסע של המל"ל'
- assertVisible: 'נבדק ב-.*'
- back
# Android back closes the card.
- back
- assertNotVisible:
    id: country-card
